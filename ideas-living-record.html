<meta charset="utf-8">
<title>Living Brain Record</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* Layout: the brain fills the left; the right is a row of game tiles and one small play card. Almost no prose. */
  :root{
    --bg:#ffffff; --bg2:#f5f5f3; --ink:#111318; --ink2:#5a5e68; --line:#1b2a5c; --accent:#e4572e; --rule:#e6e6e3;
    --navy:#131E4A; --navy2:#1B2A5C; --halo:#0B1233; --cream:#FFF7DC;
    --font:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);line-height:1.45;
    padding-block:20px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .wrap{max-width:1080px;margin:0 auto;display:grid;gap:18px}
  h1,h2,h3{font-weight:500;letter-spacing:-.02em;margin:0;text-wrap:balance}
  h1{font-size:clamp(22px,3vw,30px);line-height:1.15}
  h3{font-size:15px}
  p{margin:0}
  .eyebrow{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);font-weight:500}
  .grid{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(260px,1fr);gap:24px;align-items:start}
  @media (max-width:820px){.grid{grid-template-columns:1fr}}
  canvas{width:100%;max-width:100%;aspect-ratio:5/4;display:block;touch-action:none}
  .timeline{display:grid;gap:6px}
  .tl-top{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
  .day{font-size:20px;font-weight:500;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
  .day small{font-size:13px;color:var(--ink2);font-weight:400;margin-left:8px}
  input[type=range]{width:100%;accent-color:var(--accent);margin:0}
  .btn{background:var(--ink);color:#fff;border:0;padding:9px 14px;font:inherit;font-weight:500;cursor:pointer;border-radius:0}
  .btn.ghost{background:none;color:var(--ink);border:1px solid var(--ink)}
  .btn.small{padding:6px 11px;font-size:13px}
  .btn:disabled{opacity:.4;cursor:default}
  .btn:focus-visible,.tile:focus-visible,.swatch:focus-visible,.opt:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
  .rail{display:grid;gap:16px}
  .tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
  .tile{display:grid;gap:6px;padding:12px;border:1px solid var(--rule);background:#fff;font:inherit;text-align:left;cursor:pointer;color:var(--ink);position:relative}
  .tile[aria-pressed="true"]{border-color:var(--ink)}
  .tile .sw{width:12px;height:12px;border-radius:50%;position:absolute;top:12px;right:12px}
  .tile .n{font-weight:500}
  .tile .m{font-size:22px;font-weight:500;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1}
  .tile .m small{font-size:12px;color:var(--ink2);font-weight:400;letter-spacing:0;margin-left:4px}
  .tile.add{border-style:dashed;color:var(--ink2);align-content:center;justify-items:center}
  .play{background:var(--bg2);padding:14px;display:grid;gap:10px;min-height:150px;align-content:start}
  .play h3{display:flex;justify-content:space-between;align-items:baseline}
  .play h3 span{font-size:12px;color:var(--ink2);font-weight:400}
  .opts{display:grid;gap:6px}
  .opt{text-align:left;background:#fff;border:1px solid var(--rule);padding:9px 12px;font:inherit;cursor:pointer}
  .opt.ok{border-color:#4CAF6E} .opt.bad{border-color:#E8472E}
  .arena{position:relative;height:120px;background:#fff;border:1px solid var(--rule);overflow:hidden}
  .flash{position:absolute;width:26px;height:26px;border-radius:50%;background:var(--accent);border:0;cursor:pointer;display:none}
  .result{display:flex;align-items:baseline;gap:10px}
  .result b{font-size:26px;font-weight:500;letter-spacing:-.02em}
  .note{font-size:13px;color:var(--ink2)}
  .newf{display:grid;gap:8px}
  input[type=text]{font:inherit;padding:8px 11px;border:1px solid var(--rule);background:#fff;color:var(--ink);width:100%}
  .swatches{display:flex;gap:6px;flex-wrap:wrap}
  .swatch{width:22px;height:22px;border-radius:50%;border:2px solid transparent;cursor:pointer;padding:0}
  .swatch[aria-pressed="true"]{border-color:var(--ink)}
  @media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap">
  <header style="display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:baseline">
    <h1>Your brain, as you've played it.</h1>
    <span class="note">Example data · every round you play draws one branch</span>
  </header>

  <div class="grid">
    <div style="display:grid;gap:10px">
      <canvas id="c" aria-label="Your brain, wired by eight weeks of play" role="img"></canvas>
      <div class="timeline">
        <div class="tl-top">
          <div class="day"><span id="dayN">56</span><small id="dayL">today</small></div>
          <button class="btn ghost small" id="replay">Replay 8 weeks</button>
        </div>
        <input type="range" id="day" min="1" max="56" value="56" aria-label="Day">
      </div>
    </div>

    <aside class="rail">
      <div class="tiles" id="tiles"></div>
      <div class="play" id="play"></div>
      <p class="note" id="honest">Lines are your play, drawn. Not a scan.</p>
    </aside>
  </div>
</div>

<script>
(function(){
  const $=s=>document.querySelector(s);
  const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
  const MOTIF={red:'#E8472E',orange:'#F28C28',yellow:'#F5C63C',green:'#4CAF6E',dgreen:'#2F8F5B',blue:'#2E86DE',sky:'#7ED0E0',purple:'#8E5BD6',pink:'#E8508A'};
  function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
  const R=rng(7);
  const SHAPE='M62 32 C72 12 112 10 126 24 C146 14 176 27 176 57 C191 72 186 102 166 112 C161 137 126 142 111 127 C96 142 61 137 56 117 C31 112 21 82 36 67 C26 47 41 30 62 32 Z';
  const STEM='M104 128 L104 150 C104 156 116 156 116 150 L114 128 Z';
  const shape=new Path2D(SHAPE), stem=new Path2D(STEM);

  /* Games. Each has a home region, a colour, a motif, and a 10-second micro-round that returns a score 0..1. */
  /* Each game lists its rounds; the player picks one. A round is {name, hint, run}. */
  const games=[
    {id:'glimpse',name:'Glimpse',color:MOTIF.orange,hub:[150,78],motif:'spark',p:.55,rounds:[
      {name:'Four flashes',hint:'slow',run:(a,cb)=>playGlimpse(a,cb,4,700)},
      {name:'Six flashes',hint:'quick',run:(a,cb)=>playGlimpse(a,cb,6,450)},
      {name:'Eight flashes',hint:'blink',run:(a,cb)=>playGlimpse(a,cb,8,300)}]},
    {id:'triage',name:'Triage',color:MOTIF.blue,hub:[62,66],motif:'fork',p:.4,rounds:[
      {name:'Who owns it?',hint:'Eng / Growth',run:(a,cb)=>playTriage(a,cb,'who owns it?',[['Engineering','eng'],['Growth','growth']],[["Deploy failed on prod, rolling back","eng"],["Signup page copy A/B results in","growth"],["API latency up 40% since 9am","eng"],["Newsletter open rate hit 41%","growth"]])},
      {name:'Which product?',hint:'App / Web',run:(a,cb)=>playTriage(a,cb,'which product?',[['Mobile app','app'],['Website','web']],[["Push notifications delayed on iOS","app"],["Checkout page 404 after release","web"],["Android crash on login screen","app"],["Pricing page loads slow in Safari","web"]])},
      {name:'Rules switch',hint:'the question changes',run:(a,cb)=>playTriage(a,cb,null,null,[["Deploy failed on prod","eng","who owns it?",[['Engineering','eng'],['Growth','growth']]],["Push notifications delayed on iOS","app","which product?",[['Mobile app','app'],['Website','web']]],["Newsletter open rate hit 41%","growth","who owns it?",[['Engineering','eng'],['Growth','growth']]],["Checkout page 404","web","which product?",[['Mobile app','app'],['Website','web']]]])}]},
    {id:'field',name:'Field feed',color:MOTIF.purple,hub:[106,96],motif:'ring',p:.3,rounds:[
      {name:'Startup notes',hint:'one fact',run:(a,cb)=>playField(a,cb,'Churn dropped to 2.1% after the onboarding rewrite. Priya owns the pricing test; it ships Thursday.','Who owns the pricing test?',['Marcus','Priya','Lena'],'Priya')},
      {name:'Patient note',hint:'one number',run:(a,cb)=>playField(a,cb,'Patient, 54, sudden unilateral weakness starting 40 minutes ago. BP 178/104. No anticoagulants. Last known well: 7:50.','Blood pressure?',['148/94','178/104','170/110'],'178/104')},
      {name:'Set list',hint:'one key',run:(a,cb)=>playField(a,cb,'Set two opens with Autumn Leaves in G minor, then Blue Bossa up a half step. Drummer takes the first solo on Caravan.','Key for Autumn Leaves?',['E minor','G minor','A minor'],'G minor')}]},
    {id:'dare',name:'Daily dare',color:MOTIF.green,hub:[106,44],motif:'leaf',p:.5,rounds:[
      {name:'Other hand',hint:'motor',run:(a,cb)=>playDare(a,cb,'Brush your teeth with your other hand.')},
      {name:'New route',hint:'spatial',run:(a,cb)=>playDare(a,cb,'Take a different route for one leg of your day.')},
      {name:'Phone-free meal',hint:'attention',run:(a,cb)=>playDare(a,cb,'Eat one meal without your phone, noticing every flavour.')}]},
    {id:'wired',name:'Wired',color:MOTIF.pink,hub:[78,106],motif:'dot',p:.25,rounds:[
      {name:'Easy pairs',hint:'2 words',run:(a,cb)=>playWired(a,cb,[["ROOT",["branch","asphalt","engine"],"branch"],["SPARK",["ocean","fire","ledger"],"fire"]])},
      {name:'Harder pairs',hint:'3 words',run:(a,cb)=>playWired(a,cb,[["ANCHOR",["harbour","meadow","piano"],"harbour"],["LENS",["focus","gravel","harvest"],"focus"],["TIDE",["moon","brick","violin"],"moon"]])}]}
  ];
  const byId=Object.fromEntries(games.map(a=>[a.id,a]));

  const branches=[];
  function bez(b,t){const u=1-t;return[u*u*b.x0+2*u*t*b.cx+t*t*b.x1,u*u*b.y0+2*u*t*b.cy+t*t*b.y1]}
  const ctxTest=document.createElement('canvas').getContext('2d');
  function inside(x,y){return ctxTest.isPointInPath(shape,x,y)}
  function addBranch(act,day,score,r){
    const mine=branches.filter(b=>b.act===act.id);
    let x0,y0,ang,parent=null;
    if(mine.length&&r()<.85){parent=mine[Math.floor(r()*mine.length)];const t=.35+r()*.65;[x0,y0]=bez(parent,t);ang=parent.ang+(r()-.5)*2.2;}
    else{x0=act.hub[0]+(r()-.5)*8;y0=act.hub[1]+(r()-.5)*8;ang=r()*Math.PI*2;}
    const len=12+score*22;
    let x1=x0+Math.cos(ang)*len,y1=y0+Math.sin(ang)*len,tries=0;
    while(!inside(x1,y1)&&tries<6){ang+=1.1;x1=x0+Math.cos(ang)*len;y1=y0+Math.sin(ang)*len;tries++;}
    const bend=(r()-.5)*22;const mx=(x0+x1)/2,my=(y0+y1)/2;
    const b={act:act.id,day,score,x0,y0,x1,y1,cx:mx-Math.sin(ang)*bend,cy:my+Math.cos(ang)*bend,ang,parent,progress:1};
    branches.push(b);return b;
  }
  for(let d=1;d<=56;d++){for(const a of games){const start=a.id==='field'?15:1;if(d>=start&&R()<a.p){addBranch(a,d,.3+R()*.7,R);}}}

  /* canvas */
  const cv=$('#c'),ctx=cv.getContext('2d');let W=0,H=0,S=1,OX=0,OY=0;
  function resize(){const r=cv.getBoundingClientRect();const dpr=Math.min(devicePixelRatio||1,2);cv.width=r.width*dpr;cv.height=r.height*dpr;W=r.width;H=r.height;S=Math.min(W/210,H/168);OX=(W-200*S)/2;OY=(H-160*S)/2-4*S;ctx.setTransform(dpr,0,0,dpr,0,0);}
  addEventListener('resize',()=>{resize();draw();});
  let day=56,selected=null,signals=[],last=performance.now(),growing=[];
  function visible(){return branches.filter(b=>b.day<=day)}
  function widths(vis){const w=new Map();vis.forEach(b=>w.set(b,1.1));vis.forEach(b=>{let p=b.parent,n=0;while(p&&n<12){if(w.has(p))w.set(p,Math.min(6,w.get(p)+.45));p=p.parent;n++;}});return w;}
  function motif(b,c){const [x,y]=bez(b,b.progress);const a=byId[b.act];ctx.save();ctx.translate(x,y);ctx.fillStyle=c;ctx.strokeStyle=c;ctx.lineWidth=.8;
    switch(a.motif){
      case 'spark':ctx.beginPath();for(let i=0;i<8;i++){const r=i%2?1.2:3.4,t=i*Math.PI/4;ctx.lineTo(Math.cos(t)*r,Math.sin(t)*r);}ctx.closePath();ctx.fill();break;
      case 'fork':ctx.beginPath();ctx.moveTo(-2.5,2);ctx.lineTo(0,-1);ctx.lineTo(2.5,2);ctx.moveTo(0,-1);ctx.lineTo(0,-3.5);ctx.stroke();break;
      case 'ring':ctx.beginPath();ctx.arc(0,0,2.6,0,7);ctx.lineWidth=1.1;ctx.stroke();break;
      case 'leaf':ctx.beginPath();ctx.moveTo(0,-3.5);ctx.quadraticCurveTo(3.5,-1,0,3.5);ctx.quadraticCurveTo(-3.5,-1,0,-3.5);ctx.fill();break;
      case 'tri':ctx.beginPath();ctx.moveTo(0,-3.2);ctx.lineTo(3,2.2);ctx.lineTo(-3,2.2);ctx.closePath();ctx.fill();break;
      default:ctx.beginPath();ctx.arc(0,0,2.2,0,7);ctx.fill();
    }ctx.restore();}
  function draw(){
    ctx.clearRect(0,0,W,H);ctx.save();ctx.translate(OX,OY);ctx.scale(S,S);
    ctx.fillStyle='#0B1233';ctx.save();ctx.translate(0,1.5);ctx.fill(shape);ctx.fill(stem);ctx.restore();
    const g=ctx.createRadialGradient(105,80,10,105,80,95);g.addColorStop(0,'#1B2A5C');g.addColorStop(1,'#131E4A');ctx.fillStyle=g;ctx.fill(shape);ctx.fill(stem);
    ctx.save();ctx.clip(shape);
    ctx.strokeStyle='rgba(244,241,232,.07)';ctx.lineWidth=.6;const r2=rng(3);for(let i=0;i<40;i++){ctx.beginPath();const x=30+r2()*150,y=20+r2()*110;ctx.moveTo(x,y);ctx.bezierCurveTo(x+r2()*40-20,y+r2()*40-20,x+r2()*40-20,y+r2()*40-20,x+r2()*50-25,y+r2()*50-25);ctx.stroke();}
    const vis=visible(),w=widths(vis);ctx.lineCap='round';ctx.lineJoin='round';
    for(const b of vis){const a=byId[b.act];const dim=selected&&selected!==b.act;ctx.globalAlpha=dim?.18:1;const lw=w.get(b);ctx.strokeStyle=a.color;ctx.lineWidth=lw;
      ctx.beginPath();ctx.moveTo(b.x0,b.y0);
      if(b.progress>=1)ctx.quadraticCurveTo(b.cx,b.cy,b.x1,b.y1);else{for(let i=1;i<=12;i++){const [x,y]=bez(b,b.progress*i/12);ctx.lineTo(x,y);}}
      ctx.stroke();
      if(lw>3){ctx.strokeStyle='rgba(255,247,220,.35)';ctx.lineWidth=lw*.35;ctx.stroke();}
      if(b.progress>.6)motif(b,lw>3&&!dim?'#FFF7DC':a.color);
    }
    ctx.globalAlpha=1;
    for(const a of games){if(selected&&selected!==a.id)continue;if(!vis.some(b=>b.act===a.id))continue;ctx.fillStyle='#FFF7DC';ctx.beginPath();ctx.arc(a.hub[0],a.hub[1],2.2,0,7);ctx.fill();ctx.strokeStyle=a.color;ctx.lineWidth=1;ctx.beginPath();ctx.arc(a.hub[0],a.hub[1],4,0,7);ctx.stroke();}
    for(const s of signals){const [x,y]=bez(s.b,s.t);ctx.fillStyle='#FFF7DC';ctx.shadowColor='#FFF7DC';ctx.shadowBlur=6;ctx.beginPath();ctx.arc(x,y,1.6,0,7);ctx.fill();ctx.shadowBlur=0;}
    ctx.restore();ctx.strokeStyle='#0B1233';ctx.lineWidth=1.2;ctx.stroke(shape);ctx.restore();
  }
  function pulse(b){signals.push({b,t:0});}
  function tick(now){const dt=Math.min(50,now-last);last=now;
    for(const b of growing){b.progress=Math.min(1,b.progress+dt/(reduce?1:650));}growing=growing.filter(b=>b.progress<1);
    for(const s of signals){s.t+=dt/900;}signals=signals.filter(s=>s.t<1);
    if(signals.length<2&&Math.random()<.02){const vis=visible();if(vis.length){const b=vis[Math.floor(Math.random()*vis.length)];if(!selected||b.act===selected)signals.push({b,t:0});}}
    draw();requestAnimationFrame(tick);}
  /* timeline */
  const dayEl=$('#day');
  function setDay(d,animate){const prev=day;day=d;dayEl.value=d;$('#dayN').textContent=d;$('#dayL').textContent=d===56?'today':'week '+Math.ceil(d/7);
    if(animate&&d>prev){branches.filter(b=>b.day>prev&&b.day<=d).forEach(b=>{b.progress=0;growing.push(b);pulse(b);});}renderTiles();}
  dayEl.addEventListener('input',()=>setDay(+dayEl.value,true));
  let playing=null;
  $('#replay').onclick=()=>{if(playing){clearInterval(playing);playing=null;$('#replay').textContent='Replay 8 weeks';return;}setDay(1,false);$('#replay').textContent='Stop';playing=setInterval(()=>{if(day>=56){clearInterval(playing);playing=null;$('#replay').textContent='Replay 8 weeks';return;}setDay(day+1,true);},reduce?60:220);};

  /* tiles: one per game; tap = follow its wiring + offers a round */
  function renderTiles(){const vis=visible(),t=$('#tiles');t.innerHTML='';
    for(const a of games){const n=vis.filter(b=>b.act===a.id).length;const b=document.createElement('button');b.className='tile';b.setAttribute('aria-pressed',selected===a.id);
      b.innerHTML=`<span class="sw" style="background:${a.color}"></span><span class="n">${a.name}</span><span class="m">${n}<small>rounds</small></span>`;
      b.onclick=()=>{selected=a.id;renderTiles();openPlay(a);};t.appendChild(b);}
    const add=document.createElement('button');add.className='tile add';add.innerHTML='<span class="n">+ New game</span>';add.onclick=()=>{selected=null;renderTiles();openNew();};t.appendChild(add);}

  /* play card */
  const play=$('#play');
  function openPlay(a){play.innerHTML=`<h3>${a.name}<span>pick a round</span></h3><div class="opts">${a.rounds.map((r,i)=>`<button class="opt" data-i="${i}"><b style="font-weight:500">${r.name}</b> <span class="note">· ${r.hint}</span></button>`).join('')}</div>`;
    play.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const r=a.rounds[+b.dataset.i];r.run(a,(g,score,line)=>done(g,score,line,r));});}
  function done(a,score,line,round){if(day!==56)setDay(56,false);const b=addBranch(a,56,score,Math.random);b.progress=0;growing.push(b);pulse(b);
    play.innerHTML=`<h3>${a.name}<span>${round?round.name:''}</span></h3><div class="result"><b>${line}</b><span class="note">→ one branch, ${score>=.7?'long':score>=.4?'medium':'short'}</span></div><div class="row" style="display:flex;gap:8px"><button class="btn ghost small" id="again">Same round</button><button class="btn ghost small" id="other">Other rounds</button></div>`;
    $('#again').onclick=()=>round?round.run(a,(g,s,l)=>done(g,s,l,round)):openPlay(a);$('#other').onclick=()=>openPlay(a);renderTiles();}

  /* micro-rounds, parameterised */
  function playGlimpse(a,cb,n,show){let caught=0,shown=0;play.innerHTML=`<h3>${a.name}<span>catch ${n} flashes</span></h3><div class="arena" id="ar"><button class="flash" id="fl" aria-label="Catch"></button></div>`;const ar=$('#ar'),fl=$('#fl');
    function next(){fl.style.display='none';if(shown>=n){cb(a,caught/n,`${caught} of ${n}`);return;}setTimeout(()=>{const r=ar.getBoundingClientRect();fl.style.left=(Math.random()*(r.width-36)+5)+'px';fl.style.top=(Math.random()*(r.height-36)+5)+'px';fl.style.display='block';shown++;setTimeout(()=>{if(fl.style.display==='block')next();},show);},400+Math.random()*800);}
    fl.onclick=()=>{caught++;fl.style.display='none';next();};next();}
  function playTriage(a,cb,q,opts,msgs){let i=0,ok=0;
    function ask(){if(i>=msgs.length){cb(a,ok/msgs.length,`${ok} of ${msgs.length}`);return;}const [m,ans,q2,o2]=msgs[i];const qq=q2||q,oo=o2||opts;play.innerHTML=`<h3>${a.name}<span>${qq}</span></h3><p>${m}</p><div class="opts">${oo.map(([l,v])=>`<button class="opt" data-v="${v}">${l}</button>`).join('')}</div>`;play.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const good=b.dataset.v===ans;if(good)ok++;b.classList.add(good?'ok':'bad');setTimeout(()=>{i++;ask();},350);});}ask();}
  function playField(a,cb,text,q,opts,ans){play.innerHTML=`<h3>${a.name}<span>read once</span></h3><p>${text}</p><p class="note">Hides in <b id="cd">5</b>s</p>`;let s=5;const t=setInterval(()=>{s--;const c=$('#cd');if(c)c.textContent=s;if(s<=0){clearInterval(t);play.innerHTML=`<h3>${a.name}<span>recall</span></h3><p>${q}</p><div class="opts">${opts.map(o=>`<button class="opt">${o}</button>`).join('')}</div>`;play.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const good=b.textContent===ans;b.classList.add(good?'ok':'bad');setTimeout(()=>cb(a,good?1:.2,good?'Recalled':'Missed'),400);});}},1000);}
  function playDare(a,cb,text){play.innerHTML=`<h3>${a.name}<span>off-screen</span></h3><p>${text}</p><div class="opts"><button class="opt">Did it</button><button class="opt">Not today</button></div>`;play.querySelectorAll('.opt').forEach((b,i)=>b.onclick=()=>{if(i===0)cb(a,.8,'Done');else openPlay(a);});}
  function playWired(a,cb,sets){let i=0,ok=0;
    function ask(){if(i>=sets.length){cb(a,ok/sets.length,`${ok} of ${sets.length}`);return;}const [w,opts,ans]=sets[i];play.innerHTML=`<h3>${a.name}<span>what connects?</span></h3><p style="font-size:22px;font-weight:500;letter-spacing:-.02em">${w}</p><div class="opts">${opts.map(o=>`<button class="opt">${o}</button>`).join('')}</div>`;play.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const good=b.textContent===ans;if(good)ok++;b.classList.add(good?'ok':'bad');setTimeout(()=>{i++;ask();},350);});}ask();}
  function playGeneric(a,cb){play.innerHTML=`<h3>${a.name}<span>placeholder round</span></h3><p class="note">Your game goes here. For now, one tap counts as a round.</p><button class="btn small" id="g">Finish round</button>`;$('#g').onclick=()=>cb(a,.5+Math.random()*.5,'Played');}

  /* new game */
  function openNew(){let color=MOTIF.yellow;play.innerHTML=`<h3>New game</h3><form class="newf" id="nf"><input type="text" id="nn" placeholder="Name" aria-label="Game name" maxlength="20"><div class="swatches" id="sw"></div><button class="btn small" type="submit">Add and play</button></form>`;const sw=$('#sw');
    Object.values(MOTIF).forEach(c=>{const b=document.createElement('button');b.type='button';b.className='swatch';b.style.background=c;b.setAttribute('aria-pressed',c===color);b.onclick=()=>{color=c;[...sw.children].forEach(x=>x.setAttribute('aria-pressed',x===b));};sw.appendChild(b);});
    $('#nf').addEventListener('submit',e=>{e.preventDefault();const name=$('#nn').value.trim()||'New game';let hub,t=0;do{hub=[50+Math.random()*110,30+Math.random()*95];t++;}while(!inside(hub[0],hub[1])&&t<20);
      const a={id:'u'+Date.now(),name,color,hub,motif:'tri',p:0,rounds:[{name:'First round',hint:'placeholder',run:playGeneric}]};games.push(a);byId[a.id]=a;selected=a.id;renderTiles();a.rounds[0].run(a,(g,s,l)=>done(g,s,l,a.rounds[0]));});}

  resize();renderTiles();openPlay(games[0]);draw();requestAnimationFrame(t=>{last=t;tick(t);});
})();
</script>
