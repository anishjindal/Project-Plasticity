<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Project Plasticity</title>
<meta name="description" content="Project Plasticity: hide things among what you love, then see how many you remember">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--ease:cubic-bezier(.4,0,.2,1);--bounce:cubic-bezier(.34,1.56,.64,1);--bg:#fff;--ink:#111318;--ink2:#5a5e68;--rule:#e6e6e3;--accent:#e4572e;--gold:#F5C63C;--navy:#131E4A;
  --safeb:env(safe-area-inset-bottom,0px);--safet:env(safe-area-inset-top,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#fff}}
:root[data-theme="dark"]{--bg:#fff}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:"Inter",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body{max-width:440px;margin:0 auto;overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
button,a{font:inherit;color:inherit;touch-action:manipulation;cursor:pointer}
.app{height:100svh;display:flex;flex-direction:column;align-items:center;padding:calc(18px + var(--safet)) 16px calc(16px + var(--safeb))}
.top{width:100%;position:relative;text-align:center}
.name{font-weight:600;font-size:16px;letter-spacing:-.01em;color:var(--navy)}
.level{position:absolute;right:4px;top:2px;font-size:13px;color:var(--ink2);font-variant-numeric:tabular-nums}
.world{position:relative;width:min(100%,calc(100svh - 370px),400px);aspect-ratio:1;margin-top:6px;touch-action:manipulation;transition:width .4s var(--ease)}
.app.done .world{width:min(100%,calc(100svh - 470px),400px)}
.world canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.say{font-weight:500;font-size:clamp(20px,2.4vw,28px);letter-spacing:-.015em;line-height:1.25;margin:8px 0 0;min-height:1.25em;text-align:center}
.sub{font-size:16px;color:var(--ink2);margin:6px 0 0;min-height:1.4em;text-align:center;line-height:1.4}
.grow{flex:1;min-height:0}
.app.done .grow{flex:0 0 26px}
.opts{display:flex;justify-content:center;flex-wrap:wrap;gap:10px;width:100%;min-height:76px;align-items:center}
.opts button{width:58px;height:58px;border-radius:50%;border:0;background:#f1f2f5;padding:0;font-size:31px;line-height:1;transition:transform .15s var(--bounce),opacity .25s}
.opts button:active{transform:scale(.9)}
.opts button.gone{opacity:0;pointer-events:none;transform:scale(.4)}
.opts button.no{animation:shake .3s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.end{width:100%;text-align:center}
.result{margin:0 0 12px;font-size:24px;line-height:1.55;white-space:pre;letter-spacing:.14em;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif}
.next{display:inline-block;margin-top:20px;font-size:16px;font-weight:500;text-decoration:none;border-bottom:2px solid var(--accent);padding-bottom:2px}
.cta{margin:0 0 16px;font-size:16px;font-weight:500;color:var(--ink)}
.send{display:flex;justify-content:center;gap:34px}
.send a{display:flex;flex-direction:column;align-items:center;gap:7px;text-decoration:none;font-size:13px;color:var(--ink2)}
.send i{width:56px;height:56px;border-radius:50%;display:flex;align-items:center;justify-content:center;transition:transform .15s var(--bounce)}
.send a:active i{transform:scale(.9)}
.send svg{width:28px;height:28px;fill:#fff}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
[hidden]{display:none!important}
@media (min-width:900px){
  body{max-width:760px}
  .world{width:min(100%,calc(100svh - 390px),540px)}
  .app.done .world{width:min(100%,calc(100svh - 500px),540px)}
  .name{font-size:18px}.level{font-size:15px}.sub{font-size:18px}.result{font-size:28px}.cta{font-size:18px}
  .opts{gap:14px}.opts button{width:70px;height:70px;font-size:38px}
}
</style>
</head>
<body>
<main class="app" id="app">
  <div class="top"><div class="name">Project Plasticity</div><div class="level" id="level"></div></div>
  <div class="world"><canvas id="cv" aria-label="The things you love, around a dot"></canvas></div>
  <p class="say" id="say" aria-live="polite"></p>
  <p class="sub" id="sub"></p>
  <div class="grow"></div>
  <div class="opts" id="opts" hidden></div>
  <div class="end" id="end" hidden>
    <p class="result" id="result"></p>
    <p class="cta" id="cta"></p>
    <div class="send">
      <a id="im" href="#"><i style="background:#34C759"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3C6.5 3 2 6.7 2 11.3c0 2.6 1.5 5 3.800 6.500L5 21.500l4.300-2.100c.900.200 1.800.300 2.700.300 5.500 0 10-3.700 10-8.300S17.500 3 12 3z"/></svg></i>iMessage</a>
      <a id="wa" href="#" target="_blank" rel="noopener"><i style="background:#25D366"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.500a9.500 9.500 0 0 0-8.100 14.400L2.500 21.500l4.800-1.300A9.500 9.500 0 1 0 12 2.500zm-3.100 5c.200 0 .400 0 .600.400l.800 1.900c.100.200 0 .500-.100.700l-.600.800c.700 1.300 1.700 2.300 3.100 3l.900-.900c.200-.200.400-.200.700-.100l1.800.900c.300.100.400.300.400.600 0 1-1 2-2.100 2-3.400 0-7.300-3.900-7.300-7.200 0-1.100.900-2.100 1.800-2.100z"/></svg></i>WhatsApp</a>
    </div>
    <a class="next" href="next-v14.html">See the next game</a>
  </div>
</main>

<script src="brain.js?v=7"></script>
<script>
(function(){
const B=PPBrain,$=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const wait=ms=>new Promise(r=>setTimeout(r,ms));
const store={get(k,d){try{return JSON.parse(localStorage.getItem(k))??d;}catch(e){return d;}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}};
const buzz=ms=>{try{navigator.vibrate&&navigator.vibrate(ms);}catch(e){}};
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
const FINE=matchMedia('(pointer: fine)').matches,TAP=FINE?'Click':'Tap';
const ORANGE='#E4572E',GOLD='#F5C63C',NAVY='#131E4A';
const EMOJI='"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
const NUMW={4:'four',5:'five',6:'six',7:'seven',8:'eight'};

const ME=store.get('pp9.profile',null)||{};
const SYMBOL={music:'note',sport:'ball',code:'gear',startups:'bulb',art:'rainbow',writing:'pencil',science:'magnifier',languages:'bubble',nature:'tulip',food:'egg',games:'puzzle',wellbeing:'heart'};
const WORD={music:'Music',sport:'Sport',code:'Tech',startups:'Startups',art:'Art',writing:'Writing',science:'Science',languages:'Languages',nature:'Nature',food:'Food',games:'Games',wellbeing:'Wellbeing'};
const COLS=[B.C.red,B.C.purple,B.C.green2,B.C.blue,B.C.pink,B.C.orange,B.C.sky,B.C.green];
const loves=(Array.isArray(ME.loves)&&ME.loves.length?ME.loves:['music','sport','code','food']).filter(k=>SYMBOL[k]);
const chosen=Array.isArray(ME.picks)&&ME.picks.length?ME.picks.filter(p=>p&&p.word&&(p.kind||p.emoji||p.letter)):loves.map(k=>({kind:SYMBOL[k],word:WORD[k]}));
const EXTRA=[['note','Music'],['egg','Food'],['ball','Sport'],['tulip','Nature'],['gear','Tech'],['heart','Wellbeing'],['puzzle','Games'],['rainbow','Art']];
const MAXN=8,PLACES=chosen.slice(0,MAXN).map(p=>({id:p.kind||(p.emoji?'e:'+p.emoji:'l:'+p.letter),word:String(p.word).slice(0,14)}));
for(const [id,word] of EXTRA){if(PLACES.length>=MAXN)break;if(!PLACES.some(p=>p.id===id||p.word===word))PLACES.push({id,word});}
PLACES.forEach((p,i)=>p.col=COLS[i%COLS.length]);
function paint(g,id,x,y,s,c,c2){
  if(id.startsWith('e:')){g.save();g.font=`${Math.round(s*1.9)}px ${EMOJI}`;g.textAlign='center';g.textBaseline='middle';g.fillText(id.slice(2),x,y+s*.1);g.restore();}
  else if(id.startsWith('l:')){g.save();g.strokeStyle=c;g.lineWidth=Math.max(2,s*.16);g.beginPath();g.arc(x,y,s*.9,0,7);g.stroke();g.fillStyle=c;g.font=`600 ${Math.round(s*1.1)}px Inter,system-ui`;g.textAlign='center';g.textBaseline='middle';g.fillText(id.slice(2),x,y+s*.05);g.restore();}
  else B.drawMotif(g,{kind:id,x,y,s,c,c2});}

const POOL=[['🌋','volcano','a'],['🐙','octopus','an'],['🎺','trumpet','a'],['🌵','cactus','a'],['🚀','rocket','a'],['☂️','umbrella','an'],['🐧','penguin','a'],['🍍','pineapple','a'],['🐉','dragon','a'],['⛄','snowman','a'],['⚓','anchor','an'],['🎈','balloon','a'],['🌪️','tornado','a'],['👑','crown','a'],['🤖','robot','a'],['🐳','whale','a'],['🧀','cheese','some'],['🧭','compass','a'],['🦒','giraffe','a'],['🕰️','clock','a'],['🧲','magnet','a'],['🪂','parachute','a'],['🦜','parrot','a'],['🍄','mushroom','a'],['🛁','bathtub','a'],['🎪','circus tent','a'],['🦀','crab','a'],['🔔','bell','a'],['🪁','kite','a'],['🧊','ice cube','an']];
const DOING=['crashing into','hiding inside','taking over','dancing through','stuck in','floating above','bursting out of'];
const today=new Date(),NUM=Math.round((new Date(today.getFullYear(),today.getMonth(),today.getDate())-new Date(2026,9,1))/864e5)+1;
function todays(n){const r=B.rng(n*7919+41),idx=POOL.map((_,i)=>i);for(let i=idx.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[idx[i],idx[j]]=[idx[j],idx[i]];}return idx;}
const DATA=store.get('palace.v1',{days:{},level:1});if(!DATA.days)DATA.days={};if(!(DATA.level>=1))DATA.level=1;
const sizeOf=L=>Math.min(MAXN,4+L);
const hasRound=d=>d&&d.placed&&Object.keys(d.placed).length>=4&&typeof d.score==='number';
function lastDay(){const d=Object.keys(DATA.days).map(Number).filter(n=>n<NUM&&hasRound(DATA.days[n]));return d.length?Math.max(...d):null;}
const save=()=>store.set('palace.v1',DATA);

const cv=$('#cv');
const S={phase:'idle',n:5,cur:-1,ask:-1,guide:null,placed:{},shown:{},mark:{},fly:null,pic:null,jolt:0,parts:[]};
function ctx(){const dpr=Math.min(2,devicePixelRatio||1),w=cv.clientWidth||320;if(cv.width!==Math.round(w*dpr))cv.width=cv.height=Math.round(w*dpr);const g=cv.getContext('2d');g.setTransform(dpr,0,0,dpr,0,0);return {g,w,c:w/2};}
const spot=(i,c,w)=>{const a=-Math.PI/2+i*(Math.PI*2/S.n);return [c+Math.cos(a)*w*.34,c+Math.sin(a)*w*.33];};
function burst(x,y,col,n){if(reduced)return;for(let i=0;i<n;i++){const a=Math.random()*6.283,v=1.6+Math.random()*4.2;S.parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,l:1,c:Math.random()<.3?GOLD:col});}}
function draw(now){requestAnimationFrame(draw);const {g,w,c}=ctx();g.globalAlpha=1;g.clearRect(0,0,w,w);S.jolt*=.86;const K=Math.max(1,w/343),small=S.n>6?.86:1;
  for(let i=0;i<S.n;i++){const p=PLACES[i],[x,y]=spot(i,c,w),asked=S.phase==='recall'&&S.ask===i,dim=S.phase==='recall'&&S.ask!==i,lead=S.guide===i,off=S.guide!=null&&!lead&&S.placed[i]==null,free=S.phase==='hide'&&S.placed[i]==null&&(S.guide==null||lead);
    const dx=x-c,dy=y-c,d=Math.hypot(dx,dy)||1,ux=dx/d,uy=dy/d,ax=c+ux*w*.07,ay=c+uy*w*.07,bx=x-ux*w*.1,by=y-uy*w*.1;
    const o=(reduced?0:Math.sin(now/460+i*1.7))*w*.02+w*.028*(i%2?1:-1),mx=(ax+bx)/2-uy*o,my=(ay+by)/2+ux*o;
    g.globalAlpha=dim||off?.25:1;g.strokeStyle=p.col;g.lineWidth=asked||lead?4:2;g.lineCap='round';g.beginPath();g.moveTo(ax,ay);g.quadraticCurveTo(mx,my,bx,by);g.stroke();
    if(asked||free){const u=reduced?0:(now/1300+i*.2)%1;g.globalAlpha=(1-u)*(asked||lead?.85:.45);g.strokeStyle=asked||lead?ORANGE:p.col;g.lineWidth=2;g.beginPath();g.arc(x,y,w*(.075+u*.045)*small,0,7);g.stroke();}
    g.globalAlpha=dim||off?.3:1;paint(g,p.id,x,y,w*(asked||lead?.066:.056)*small,p.col,GOLD);
    g.fillStyle=asked||lead?NAVY:'#5a5e68';g.font=(asked||lead?'600 ':'500 ')+(12.5*K*small).toFixed(1)+'px Inter,system-ui';g.textAlign='center';const up=y<c-w*.05;g.textBaseline=up?'bottom':'top';g.fillText(p.word,x,up?y-w*.095*small:y+w*.08*small);
    const it=S.shown[i];if(it!=null){const m=S.mark[i];g.globalAlpha=dim&&!m?.3:1;const ex=x+(ux>=-.01?1:-1)*w*.105*small,ey=y;
      g.font=Math.round(w*.08*small)+'px '+EMOJI;g.textAlign='center';g.textBaseline='middle';g.fillText(POOL[it][0],ex,ey);
      if(m){g.fillStyle=m==='r'?ORANGE:'#8b8f99';g.beginPath();g.arc(ex+w*.048,ey-w*.042,w*.015,0,7);g.fill();}}
    g.globalAlpha=1;}
  if(S.fly){const f=S.fly,k=Math.min(1,(performance.now()-f.t0)/(reduced?1:480)),e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2,[tx,ty]=spot(f.to,c,w);
    g.font=Math.round(w*(.2-.11*e))+'px '+EMOJI;g.textAlign='center';g.textBaseline='middle';g.fillText(POOL[f.item][0],c+(tx-c)*e,c+(ty-c)*e-Math.sin(e*Math.PI)*w*.08);
    if(k>=1){S.fly=null;S.shown[f.to]=f.item;burst(tx,ty,PLACES[f.to].col,26);S.jolt=1;if(f.done)f.done();}}
  else if(S.pic){const p=S.pic,pl=PLACES[p.to],t=(performance.now()-p.t0)/1000,pop=Math.min(1,t/.25),wob=reduced?0:Math.sin(t*9)*.12;
    g.save();g.translate(c,c);g.strokeStyle=pl.col;g.lineCap='round';g.lineWidth=3;
    for(let k=0;k<14;k++){const a=k*Math.PI/7+(reduced?0:t*.5),r1=w*(.13+(k%2?.012:0)),r2=w*(.17+(k%2?.035:.012))*pop;g.globalAlpha=.55;g.beginPath();g.moveTo(Math.cos(a)*r1,Math.sin(a)*r1);g.lineTo(Math.cos(a)*r2,Math.sin(a)*r2);g.stroke();}
    g.globalAlpha=1;paint(g,pl.id,-w*.035,w*.03,w*.1*pop,pl.col,GOLD);
    g.rotate(wob);g.font=Math.round(w*.16*pop)+'px '+EMOJI;g.textAlign='center';g.textBaseline='middle';g.fillText(POOL[p.item][0],w*.05,-w*.045);g.restore();}
  else if(S.phase==='hide'&&S.cur>=0){const b=reduced?0:Math.sin(now/300)*w*.008;g.font=Math.round(w*.2)+'px '+EMOJI;g.textAlign='center';g.textBaseline='middle';g.fillText(POOL[S.cur][0],c,c+b);
    if(S.guide!=null&&!reduced){const u=(now/1500)%1,e=u<.5?2*u*u:1-Math.pow(-2*u+2,2)/2,[tx,ty]=spot(S.guide,c,w);g.globalAlpha=Math.sin(u*Math.PI)*.5;g.font=Math.round(w*(.14-.06*e))+'px '+EMOJI;g.fillText(POOL[S.cur][0],c+(tx-c)*e,c+(ty-c)*e-Math.sin(e*Math.PI)*w*.05);g.globalAlpha=1;}}
  else{const beat=reduced?0:(Math.sin(now/420)+1)/2,base=w*.045;g.fillStyle='rgba(228,87,46,.15)';g.beginPath();g.arc(c,c,base*(2+beat*.3+S.jolt*1.2),0,7);g.fill();g.fillStyle=ORANGE;g.beginPath();g.arc(c,c,base*(1+beat*.08+S.jolt*.5),0,7);g.fill();}
  S.parts=S.parts.filter(p=>p.l>0);for(const p of S.parts){p.x+=p.vx;p.y+=p.vy;p.vy+=.07;p.vx*=.96;p.vy*=.96;p.l-=.03;if(p.l<=0)continue;g.globalAlpha=p.l;g.fillStyle=p.c;g.beginPath();g.arc(p.x,p.y,4*p.l,0,7);g.fill();}g.globalAlpha=1;}

const say=(t,s)=>{$('#say').textContent=t;if(s!=null)$('#sub').textContent=s;};
let onPlace=null;
cv.addEventListener('click',e=>{if(S.phase!=='hide'||S.fly||!onPlace)return;const r=cv.getBoundingClientRect(),x=e.clientX-r.left,y=e.clientY-r.top,w=r.width,c=w/2;
  let best=-1,bd=w*.17;for(let i=0;i<S.n;i++){if(S.placed[i]!=null)continue;const [px,py]=spot(i,c,w),d=Math.hypot(px-x,py-y);if(d<bd){bd=d;best=i;}}if(S.guide!=null&&best!==S.guide)return;if(best>=0){const f=onPlace;onPlace=null;f(best);}});
const pickPlace=()=>new Promise(res=>{onPlace=res;});
const flyTo=(item,to)=>new Promise(res=>{S.fly={item,to,t0:performance.now(),done:res};});
function pickItem(){return new Promise(res=>{const el=$('#opts');
  const h=e=>{const b=e.target.closest('button');if(!b||b.classList.contains('gone'))return;el.removeEventListener('click',h);res({item:+b.dataset.i,b});};el.addEventListener('click',h);});}
function buildOpts(items){const el=$('#opts'),order=items.slice().sort(()=>Math.random()-.5);el.innerHTML=order.map(i=>`<button type="button" data-i="${i}" aria-label="${POOL[i][1]}">${POOL[i][0]}</button>`).join('');el.hidden=false;}

async function hide(items){const n=items.length;S.n=n;S.phase='hide';S.placed={};S.shown={};S.mark={};$('#opts').hidden=true;
  for(let k=0;k<n;k++){const it=items[k],[,word,art]=POOL[it];S.cur=it;let to;
    if(k===n-1){to=[...Array(n).keys()].find(i=>S.placed[i]==null);say(`The ${word} takes the last spot`,PLACES[to].word);await wait(reduced?900:1400);}
    else{say(`Hide the ${word}`,k===0?`${TAP} any one of these`:`${n-k} left to hide`);to=await pickPlace();}
    S.placed[to]=it;S.cur=-1;buzz(8);await flyTo(it,to);
    S.pic={item:it,to,t0:performance.now()};say('Picture it',`${art} ${word} ${DOING[(NUM+k*3+to)%DOING.length]} ${PLACES[to].word.toLowerCase()}`);await wait(reduced?1900:2600);S.pic=null;}
  return {...S.placed};}

async function recall(placed,head,sub){const n=Object.keys(placed).length;S.n=n;S.phase='recall';S.cur=-1;S.shown={};S.mark={};S.placed={...placed};
  say(head,sub);S.ask=-1;await wait(reduced?1200:1900);
  const order=Object.keys(placed).map(Number).sort(()=>Math.random()-.5);buildOpts(order.map(i=>placed[i]));let right=0;
  for(const i of order){S.ask=i;S.jolt=.6;say(`What did you hide in ${PLACES[i].word}?`,right===0&&S.mark[i]==null&&Object.keys(S.mark).length===0?`${TAP} it below`:'');
    const {item,b}=await pickItem(),truth=placed[i],ok=item===truth,{w,c}=ctx(),[x,y]=spot(i,c,w);
    S.shown[i]=truth;S.mark[i]=ok?'r':'n';
    if(ok){b.classList.add('gone');burst(x,y,PLACES[i].col,28);buzz(10);say([`Yes, the ${POOL[truth][1]}`,`The ${POOL[truth][1]}, obviously`,`Nailed it, the ${POOL[truth][1]}`,`Of course, the ${POOL[truth][1]}`][right%4],'');right++;}
    else{b.classList.add('no');setTimeout(()=>b.classList.remove('no'),320);const t=$$('#opts button').find(o=>+o.dataset.i===truth);if(t)t.classList.add('gone');buzz([4,40,4]);say(`It was the ${POOL[truth][1]}`,'');}
    await wait(reduced?900:1300);}
  S.ask=-1;S.phase='idle';$('#opts').hidden=true;return right;}

const WD=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'],MO=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const KEMO={note:'🎵',ball:'⚽',gear:'⚙️',bulb:'💡',rainbow:'🎨',pencil:'✏️',magnifier:'🔬',bubble:'💬',tulip:'🌷',egg:'🍳',puzzle:'🧩',heart:'❤️'};
const emo=p=>p.id.startsWith('e:')?p.id.slice(2):KEMO[p.id]||'🧡';
function pairs(day){const pl=day.placed||{},mk=day.marks||{},ks=Object.keys(pl).map(Number).sort((a,b)=>a-b),ps=ks.map(i=>emo(PLACES[i])+(mk[i]==='n'?'❔':POOL[pl[i]][0])),per=ps.length>4?Math.ceil(ps.length/2):ps.length,rows=[];
  for(let i=0;i<ps.length;i+=per)rows.push(ps.slice(i,i+per).join('   '));return rows;}
function finish(day){S.phase='end';$('#opts').hidden=true;$('#app').classList.add('done');$('#level').textContent=`Level ${DATA.level}`;
  const rows=pairs(day),n=Object.keys(day.placed).length,k=day.score,first=POOL[(day.items||[0])[0]][1],last=(day.rounds||[]).slice(-1)[0],lv=last?last.level:1;
  const url=/^(localhost|127\.|\[::1\])/.test(location.host)?'':'\n'+location.origin+location.pathname.replace(/[^/]*$/,'');
  const text=`Project Plasticity, ${WD[today.getDay()]} ${today.getDate()} ${MO[today.getMonth()]}\n\n${rows.join('\n')}\n\nI remembered ${k===n?'all '+n:k+' of '+n}. Can you beat that?${url}`;
  $('#result').textContent=rows.join('\n');$('#cta').textContent='Send it to a friend';
  $('#im').href='sms:&body='+encodeURIComponent(text);$('#wa').href='https://wa.me/?text='+encodeURIComponent(text);$('#end').hidden=false;}

async function practice(){const A=4,Bi=6;S.n=2;S.placed={};S.shown={};S.mark={};$('#level').textContent='Practice';$('#opts').hidden=true;
  say(ME.name?`${ME.name}, a quick practice`:'A quick practice','Two things, then the real game');await wait(reduced?1200:2000);S.phase='hide';
  for(const [k,it] of [[0,A],[1,Bi]]){S.cur=it;S.guide=k;say(`${TAP} ${PLACES[k].word}`,`That hides the ${POOL[it][1]} there`);await pickPlace();S.guide=null;S.placed[k]=it;S.cur=-1;buzz(8);await flyTo(it,k);
    S.pic={item:it,to:k,t0:performance.now()};say('Now picture it',k===0?'A silly picture is easier to remember':`${POOL[it][2]} ${POOL[it][1]} in ${PLACES[k].word.toLowerCase()}`);await wait(reduced?1900:2600);S.pic=null;}
  S.phase='recall';S.shown={};S.ask=-1;say('Now they are hidden','Can you remember what was where?');await wait(reduced?1300:2100);buildOpts([A,Bi]);
  for(const i of [1,0]){S.ask=i;S.jolt=.6;say(`What did you hide in ${PLACES[i].word}?`,`${TAP} it below`);
    for(;;){const {item,b}=await pickItem();if(item===S.placed[i]){b.classList.add('gone');S.shown[i]=item;S.mark[i]='r';const {w,c}=ctx(),[x,y]=spot(i,c,w);burst(x,y,PLACES[i].col,28);buzz(10);say(`Yes, the ${POOL[item][1]}`,'');break;}
      b.classList.add('no');setTimeout(()=>b.classList.remove('no'),320);say(`What did you hide in ${PLACES[i].word}?`,'Not that one, try the other');}
    await wait(reduced?900:1300);}
  S.ask=-1;S.phase='idle';$('#opts').hidden=true;say('That is the whole game','Next, more things, and you choose where');await wait(reduced?1800:2800);S.shown={};S.mark={};S.placed={};}

async function game(){const day=DATA.days[NUM]||(DATA.days[NUM]={});let practised=false;
  if(location.hash==='#first'){try{history.replaceState(null,'',location.pathname+location.search);}catch(e){}await practice();practised=true;}
  $('#level').textContent=`Level ${DATA.level}`;
  if(day.done&&hasRound(day)){S.n=Object.keys(day.placed).length;S.shown={...day.placed};S.placed={...day.placed};S.mark={...(day.marks||{})};
    say(`${day.score} of ${S.n} remembered`,'Come back tomorrow');finish(day);return;}
  const prevNum=lastDay();
  if(prevNum!==null&&!day.recall){const pl=DATA.days[prevNum].placed,n=Object.keys(pl).length,k=await recall(pl,prevNum===NUM-1?`Yesterday’s ${NUMW[n]||n}`:`Last time’s ${NUMW[n]||n}`,'After a night of sleep, what was where?');
    day.recall={of:prevNum,score:k,n};save();say(`${k} of ${n} after a night of sleep`,k===n?'They all stayed':'The rest are shown beside your things');await wait(reduced?2400:3800);}
  const pool=todays(NUM);let used=0;day.rounds=day.rounds||[];
  for(let r=day.rounds.length;r<2;r++){const L=DATA.level,n=sizeOf(L),items=pool.slice(used,used+n);used+=n;S.n=n;S.shown={};S.mark={};S.placed={};S.phase='idle';$('#level').textContent=`Level ${L}`;
    say(r===0?(ME.name?`${ME.name}, hide ${NUMW[n]} things`:`Hide ${NUMW[n]} things`):`Level ${L}`,r===0?(practised?'This time you choose where each one goes':'Each one goes with something you love'):`${NUMW[n][0].toUpperCase()+NUMW[n].slice(1)} things this time`);await wait(reduced?1400:2300);
    const placed=await hide(items),k=await recall(placed,'Now, what was where?','No peeking'),pass=k>=n-1;
    day.rounds.push({level:L,n,score:k});day.placed=placed;day.marks={...S.mark};day.items=items;day.score=k;day.at=Date.now();if(pass&&n<MAXN||pass&&L<4)DATA.level=L+1;save();
    S.jolt=1;const {w,c}=ctx();burst(c,c,ORANGE,k===n?60:24);buzz(k===n?[10,40,20]:8);
    const age=+ME.age>=18?+ME.age:0,more=pass&&r===0&&DATA.level>L;
    say(`${k} of ${n} remembered`,more?`Level ${DATA.level} is open`:pass?(age&&k===n?`Not bad for a ${age}-year-old brain`:'That is today done'):k>=n-2?'It gets easier with practice':'The first days are the hardest');
    if(!more)break;await wait(reduced?2200:3400);}
  day.done=true;save();await wait(reduced?600:1500);
  $('#sub').textContent='Come back tomorrow';finish(day);}
requestAnimationFrame(draw);game();
})();
</script>
