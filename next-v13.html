<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Project Plasticity</title>
<meta name="description" content="Project Plasticity: the next game is under development">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#fff;--ink:#111318;--ink2:#5a5e68;--accent:#e4572e;--navy:#131E4A;--safeb:env(safe-area-inset-bottom,0px);--safet:env(safe-area-inset-top,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#fff}}
:root[data-theme="dark"]{--bg:#fff}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:"Inter",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body{max-width:440px;margin:0 auto;overflow:hidden;-webkit-tap-highlight-color:transparent}
a{font:inherit;color:inherit;touch-action:manipulation;cursor:pointer}
.app{height:100svh;display:flex;flex-direction:column;align-items:center;padding:calc(18px + var(--safet)) 16px calc(22px + var(--safeb))}
.name{font-weight:600;font-size:16px;letter-spacing:-.01em;color:var(--navy)}
.world{position:relative;width:min(100%,calc(100svh - 400px),380px);aspect-ratio:1;margin-top:8px}
.world canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:pointer}
.say{font-weight:500;font-size:clamp(20px,2.4vw,28px);letter-spacing:-.015em;line-height:1.25;margin:14px 0 0;text-align:center}
.sub{font-size:16px;color:var(--ink2);margin:6px 0 0;text-align:center;line-height:1.4}
.grow{flex:1;min-height:0}
.dock{width:min(100%,600px);text-align:center}
.arc{position:relative;width:100%;aspect-ratio:5/1}
.arc svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.mic{position:absolute;left:50%;top:66.6%;width:72px;height:72px;margin:-36px 0 0 -36px;border-radius:50%;background:#c9cbd1;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 8px #fff,0 0 0 9px #e3e4e8}
.mic svg{position:static;width:30px;height:30px;fill:#fff}
.status{margin-top:22px;font-size:14px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;color:var(--ink)}
.back{display:inline-block;margin-top:18px;font-size:16px;font-weight:500;text-decoration:none;border-bottom:2px solid var(--accent);padding-bottom:2px}
@media (min-width:900px){
  body{max-width:760px}
  .world{width:min(100%,calc(100svh - 440px),460px)}
  .name{font-size:18px}.sub{font-size:18px}
  .mic{width:84px;height:84px;margin:-42px 0 0 -42px}.mic svg{width:34px;height:34px}
}
</style>
</head>
<body>
<main class="app">
  <div class="name">Project Plasticity</div>
  <div class="world"><canvas id="cv" aria-hidden="true"></canvas></div>
  <p class="say">Next, a game you play by talking</p>
  <p class="sub" id="sub"></p>
  <div class="grow"></div>
  <div class="dock">
    <div class="arc">
      <svg viewBox="0 0 600 120" preserveAspectRatio="none" aria-hidden="true"><path d="M6 6 Q300 154 594 6" fill="none" stroke="#c4c6cc" stroke-width="1" stroke-dasharray="3 5" vector-effect="non-scaling-stroke"/></svg>
      <div class="mic" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M12 15a3.5 3.5 0 0 0 3.5-3.5v-5a3.5 3.5 0 0 0-7 0v5A3.5 3.5 0 0 0 12 15zm6-3.5a1 1 0 0 0-2 0 4 4 0 0 1-8 0 1 1 0 0 0-2 0 6 6 0 0 0 5 5.9V20H9a1 1 0 0 0 0 2h6a1 1 0 0 0 0-2h-2v-2.6a6 6 0 0 0 5-5.9z"/></svg></div>
    </div>
    <div class="status">Under development</div>
    <a class="back" href="game-v13.html">Back to today</a>
  </div>
</main>
<script>
(function(){
const $=s=>document.querySelector(s),cv=$('#cv');
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches,FINE=matchMedia('(pointer: fine)').matches;
const ORANGE='#E4572E',NAVY='#131E4A',GREY='#9a9ea8';
$('#sub').textContent=FINE?'Move over the ball to wake it':'Touch the ball to wake it';
const S={mode:'idle',e:.2,pulse:0,px:0,py:0,over:false,hover:0,rip:0,rx:0,ry:0};
function ctx(){const dpr=Math.min(2,devicePixelRatio||1),w=cv.clientWidth||300;if(cv.width!==Math.round(w*dpr))cv.width=cv.height=Math.round(w*dpr);const g=cv.getContext('2d');g.setTransform(dpr,0,0,dpr,0,0);return {g,w};}
function at(e){const r=cv.getBoundingClientRect();S.px=e.clientX-r.left;S.py=e.clientY-r.top;S.over=true;}
cv.addEventListener('pointermove',at);
cv.addEventListener('pointerdown',e=>{at(e);S.rx=S.px;S.ry=S.py;S.rip=performance.now();S.pulse=1;});
cv.addEventListener('pointerleave',()=>{S.over=false;});
cv.addEventListener('pointerup',e=>{if(e.pointerType!=='mouse')S.over=false;});
function draw(now){requestAnimationFrame(draw);const {g,w}=ctx(),t=reduced?0:now/1000,c=w/2,Rad=w*.44,K=Math.max(.8,w/380);
  const target=S.mode==='speak'?.62+.38*Math.sin(t*9)*Math.sin(t*2.3):S.mode==='listen'?.3+.7*S.pulse:S.mode==='end'?.5:.34;
  S.e+=(Math.max(.12,target)-S.e)*.09;S.pulse*=.94;S.hover+=((S.over?1:0)-S.hover)*.12;g.clearRect(0,0,w,w);
  const rr=S.rip?(now-S.rip)/800:2,rows=54,rot=t*.22,tx=.16,ct=Math.cos(tx),st=Math.sin(tx);
  for(let i=0;i<rows;i++){const lat=-Math.PI/2+(i+.5)*Math.PI/rows,cl=Math.cos(lat),n=Math.max(6,Math.round(118*cl));
    for(let j=0;j<n;j++){const lon=j/n*6.2832+rot+i*.11,la=lat+(Math.sin(lon*2+t*1.3)*(.07+.15*S.e)+Math.sin(lon*3-t*.8)*.05)*cl;
      const x=Math.cos(la)*Math.sin(lon),y0=Math.sin(la),z0=Math.cos(la)*Math.cos(lon),y=y0*ct-z0*st,z=y0*st+z0*ct;if(z<-.1)continue;
      const mid=.2*Math.sin(lon*2+t*.7),d=(lat-mid)/(.17+.13*S.e),zz=Math.max(0,z);let k=Math.exp(-d*d)*(.3+.7*S.e),sx=c+x*Rad,sy=c+y*Rad;
      if(S.hover>.02){const dx=sx-S.px,dy=sy-S.py,dp=Math.hypot(dx,dy)/Rad,gl=Math.exp(-dp*dp/.09)*S.hover;if(gl>.02){k=Math.max(k,gl);const m=gl*7*K/(Math.hypot(dx,dy)||1);sx+=dx*m;sy+=dy*m;}}
      if(rr<1){const dr=Math.hypot(sx-S.rx,sy-S.ry)/Rad-rr*1.7,rk=Math.exp(-dr*dr/.012)*(1-rr);if(rk>k)k=rk;}
      g.globalAlpha=.3+.7*zz;g.fillStyle=k>.55?NAVY:k>.2?ORANGE:GREY;g.beginPath();g.arc(sx,sy,(.9+k*2.5)*(.55+.45*zz)*K,0,6.2832);g.fill();}}
  g.globalAlpha=1;}

requestAnimationFrame(draw);
})();
</script>
</body>
</html>
