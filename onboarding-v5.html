<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Plasticity</title>
<meta name="description" content="Your brain rewires around what you do. Tap it.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--ease:cubic-bezier(.4,0,.2,1);--dur:.6s;--bg:#fff;--ink:#111318;--ink2:#5a5e68;--accent:#e4572e;--navy:#131E4A;--navy2:#1B2A5C;--edge:#0B1233;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#fff}}
:root[data-theme="dark"]{--bg:#fff}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Inter",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body{font-size:18px;line-height:1.5;overflow-x:hidden}
button,a{font:inherit;color:inherit}
.dots{position:fixed;top:20px;left:0;right:0;display:flex;justify-content:center;gap:10px;z-index:3}
.dots i{width:7px;height:7px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--ink2);transition:background var(--dur) var(--ease),box-shadow var(--dur) var(--ease)}
.dots i.on{background:var(--accent);box-shadow:none}.dots i.done{background:var(--ink);box-shadow:none}
.app{min-height:100svh;display:flex;flex-direction:column;align-items:center;padding:56px 16px 40px;text-align:center}
.stage{position:relative;width:min(100%,640px);height:min(46svh,480px);transition:height var(--dur) var(--ease),opacity var(--dur) var(--ease)}
.stage.away{height:0;opacity:0}
.stage canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:manipulation}
.stage.tappable canvas{cursor:pointer}
.copy{width:min(100%,560px);margin-top:12px}
.s{display:none}.s.on{display:block;animation:rise var(--dur) var(--ease)}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
h1,h2{margin:0;font-weight:500;letter-spacing:-.03em;line-height:1.06}
h1{font-size:clamp(30px,4.4vw,48px)}
h2{font-size:clamp(28px,3.6vw,40px)}
.say{color:var(--ink2);margin:12px 0 0;font-size:clamp(17px,1.8vw,20px);min-height:1.5em}
.next{display:inline-block;margin-top:24px;background:none;border:0;padding:0 0 4px;border-bottom:1.5px solid var(--accent);font-weight:500;font-size:19px;cursor:pointer;text-decoration:none;color:var(--ink)}
.next:hover{color:var(--accent)}
.next[hidden]{display:none}
.next[disabled]{opacity:.25;cursor:default}
.quiet{display:inline-block;margin:24px 0 0 28px;background:none;border:0;padding:0 0 3px;border-bottom:1px solid #e6e6e3;font-size:16px;color:var(--ink2);cursor:pointer}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.sr:focus{position:static;width:auto;height:auto;clip:auto;display:block;margin:10px auto 0;background:none;border:0;border-bottom:1px solid #e6e6e3;font-size:15px;color:var(--ink2)}
/* choices are words with a circle */
.picks{display:flex;flex-wrap:wrap;justify-content:center;gap:4px 22px;margin-top:20px}
.pick{border:0;background:none;padding:6px 0;font-size:17px;color:var(--ink2);cursor:pointer}
.pick::before{content:"";display:inline-block;width:9px;height:9px;border-radius:50%;box-shadow:inset 0 0 0 1.5px currentColor;margin-right:9px;vertical-align:1px}
.pick:hover{color:var(--ink)}
.pick[aria-pressed=true]{color:var(--ink)}.pick[aria-pressed=true]::before{background:var(--accent);box-shadow:none}
/* the round board */
.boardwrap{position:relative;width:min(100%,420px,max(260px,calc(100svh - 300px)));margin:8px auto 0;display:none}
.boardwrap.on{display:block;animation:rise var(--dur) var(--ease)}
.board{position:relative;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 50% 45%,var(--navy2),var(--navy) 70%);box-shadow:0 0 0 3px var(--edge)}
.tile{position:absolute;width:12.5%;aspect-ratio:1;margin:-6.25% 0 0 -6.25%;padding:0;border:0;border-radius:50%;background:rgba(247,238,221,.08);color:var(--navy);font-weight:500;font-size:clamp(15px,3.2vw,22px);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .18s,transform .18s;z-index:1}
.tile:hover{background:rgba(247,238,221,.16)}
.board.locked .tile{cursor:default}
.tile.lit{background:#FFF7DC;transform:scale(1.12);z-index:3}
.tile.got{background:#FFF0BE;z-index:3}
.tile.miss{background:var(--accent);color:#fff;z-index:3}
.wires{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:2}
.wires path{fill:none;stroke:#FFF0BE;stroke-linecap:round;stroke-linejoin:round}
.big{font-weight:500;font-size:clamp(40px,7vw,72px);letter-spacing:-.04em;line-height:1;font-variant-numeric:tabular-nums;margin-top:6px}
.big .arr{color:var(--accent);font-weight:400;margin:0 .12em}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);font-size:14px;color:var(--ink2);opacity:0;transition:opacity .3s}
.toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){.s.on,.boardwrap.on{animation:none}}
</style>
</head>
<body>
<div class="dots" aria-hidden="true"><i class="on"></i><i></i><i></i><i></i></div>
<main class="app">
  <div class="stage tappable" id="stage"><canvas id="cv" role="img" aria-label="Your brain"></canvas></div>
  <div class="boardwrap" id="bw"><div class="board" id="board" aria-label="Neurons"></div><svg class="wires" aria-hidden="true"></svg></div>

  <div class="copy">
    <!-- 1 · the empty brain: tap it -->
    <section class="s on" data-s="0">
      <h1>Your brain rewires around what you do.</h1>
      <p class="say" id="say0">Tap it.</p>
      <button class="sr" id="fire-kb" type="button">Fire a neuron</button>
      <button class="next" type="button" data-go="1" hidden id="n0">Next →</button>
    </section>
    <!-- 2 · what lights you up -->
    <section class="s" data-s="1">
      <h2>What lights you up?</h2>
      <div class="picks" id="picks"></div>
      <button class="next" type="button" data-go="2" id="n1" disabled>That’s me →</button>
    </section>
    <!-- 3 · first game, right here -->
    <section class="s" data-s="2">
      <h2 id="g-say">Watch.</h2>
      <div id="g-result" hidden><div class="big" id="g-big"></div><p class="say" id="g-line"></p><button class="next" type="button" data-go="3">See your brain →</button></div>
    </section>
    <!-- 4 · this is neuroplasticity -->
    <section class="s" data-s="3">
      <h2>This is neuroplasticity.</h2>
      <p class="say">You built this pathway today.</p>
      <a class="next" href="today-v1.html" id="to-today">Today’s puzzle →</a><button class="quiet" type="button" id="share">Share</button>
    </section>
  </div>
</main>
<div class="toast" id="toast" aria-live="polite"></div>

<script src="brain.js"></script>
<script src="board.js"></script>
<script src="share.js"></script>
<script>
(function(){
const B=PPBrain,sm=B.sm,$=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const store={get(k,d){try{return JSON.parse(localStorage.getItem(k))??d;}catch(e){return d;}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}};
/* #reset wipes everything saved, for a true first visit */
if(location.hash==='#reset'){try{['pp4.profile','pp4.daily'].forEach(k=>localStorage.removeItem(k));}catch(e){}history.replaceState(null,'',location.pathname);}
/* been here before: skip straight to today */
const handoff=p=>'today-v1.html?p='+encodeURIComponent(btoa(JSON.stringify({interests:p.interests||[],goals:p.goals||[]})));
const savedP=store.get('pp4.profile',null);if(savedP&&location.hash!=='#new'){location.replace(handoff(savedP));return;}
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;const D=ms=>reduced?1:ms;
const P={interests:[],first:null};

/* ---------- the brain, changing the same five ways the landing story did ---------- */
const cv=$('#cv'),draw=B.renderer(cv);let lay={fit:1,ox:0,oy:0};
const motifs=[],paths=[],sparks=[];let fill={from:0,to:0,t0:0},neuron=null;
function frame(now){
  for(let i=motifs.length-1;i>=0;i--){const m=motifs[i];m.k=m.dying?1-sm((now-m.dying)/D(450)):sm((now-m.born)/D(650));if(m.dying&&m.k<=0)motifs.splice(i,1);}
  for(let i=paths.length-1;i>=0;i--){const p=paths[i];p.frac=p.dying?1-sm((now-p.dying)/D(500)):sm((now-p.born)/D(900));if(p.dying&&p.frac<=0)paths.splice(i,1);}
  for(const s of sparks){const t=(now-s.born)/1000;s.a=t<.15?t/.15:.85+.15*Math.sin(t*3+s.x);s.r=4+3*Math.exp(-t*3);}
  /* the last change: one pathway goes thin → defined → steady */
  if(neuron){const v=(now-neuron.t0)/1000;neuron.p.w=3+4*sm(v-1)+5*sm(v-2.2);neuron.p.frac=sm(v/1.2);}
  const f=fill.from+(fill.to-fill.from)*sm((now-fill.t0)/D(1800));
  const r=draw({motifs,paths:neuron?[...paths.map(p=>({...p,alpha:.35})),neuron.p]:paths,sparks:neuron?[]:sparks,fill:f});if(r)lay=r;
  requestAnimationFrame(frame);}
requestAnimationFrame(frame);
const toBrain=(cx,cy)=>{const b=cv.getBoundingClientRect();return [(cx-b.left-lay.ox)/lay.fit,(cy-b.top-lay.oy)/lay.fit];};

/* ---------- screens ---------- */
let screen=0;
function go(n){screen=n;$$('.s').forEach(s=>s.classList.toggle('on',+s.dataset.s===n));
  $$('.dots i').forEach((d,i)=>{d.classList.toggle('on',i===n);d.classList.toggle('done',i<n);});
  $('#stage').classList.toggle('tappable',n===0);$('#stage').classList.toggle('away',n===2);$('#bw').classList.toggle('on',n===2);
  if(n===2)firstGame();if(n===3)reveal();}
document.addEventListener('click',e=>{const g=e.target.closest('[data-go]');if(g&&!g.disabled)go(+g.dataset.go);});

/* 1 · tap to fire: a signal, then two connected (landing: the outline, then the first path) */
const lines=['That’s a signal.','Two signals, connected.','Fire together, wire together.'];
function fire(pt){sparks.push({x:pt[0],y:pt[1],r:6,a:0,born:performance.now()});
  if(sparks.length>1){const a=sparks.at(-2),b=sparks.at(-1),m=[(a.x+b.x)/2+(b.y-a.y)*.2,(a.y+b.y)/2-(b.x-a.x)*.2];paths.push({key:'w',pts:B.route([[a.x,a.y],m,[b.x,b.y]],16),born:performance.now(),w:3+sparks.length,frac:0});}
  $('#say0').textContent=lines[Math.min(lines.length-1,sparks.length-1)];$('#n0').hidden=false;}
cv.addEventListener('click',e=>{if(screen!==0)return;const p=toBrain(e.clientX,e.clientY);if(B.inside(p[0],p[1]))fire(p);});
const kbPts=[[300,250],[460,200],[420,360]];$('#fire-kb').addEventListener('click',()=>fire(kbPts[sparks.length%3]));

/* 2 · interests grow their drawings, and each one wires to your first signal (landing: more paths, different skills) */
let seed=7;
Object.entries(B.INTERESTS).forEach(([k,I])=>{if(k==='other')return;const b=document.createElement('button');b.type='button';b.className='pick';b.textContent=I.label;b.setAttribute('aria-pressed','false');
  b.addEventListener('click',()=>{const on=!P.interests.includes(k);if(on&&P.interests.length>=3)return;const now=performance.now();
    if(on){P.interests.push(k);B.scatter(motifs.filter(m=>!m.dying),I.at,I.kinds,11,seed+=13,100).forEach((m,i)=>{m.owner=k;m.born=now+i*55;motifs.push(m);});
      const from=sparks[0]?[sparks[0].x,sparks[0].y]:B.CENTRE;paths.push({key:'i:'+k,pts:B.route([from,[(from[0]+I.at[0])/2,(from[1]+I.at[1])/2-30],I.at],16),born:now,w:4,frac:0});}
    else{P.interests=P.interests.filter(x=>x!==k);motifs.forEach(m=>{if(m.owner===k&&!m.dying)m.dying=now;});paths.forEach(p=>{if(p.key==='i:'+k&&!p.dying)p.dying=now;});}
    b.setAttribute('aria-pressed',on);$('#n1').disabled=!P.interests.length;});
  $('#picks').appendChild(b);});

/* 3 · the first game: two quick rounds, same difficulty, so you can beat yourself in a minute */
const WORDS4={music:['BEAT','TUNE'],sport:['PACE','GOAL'],code:['LOOP','CODE'],startups:['PLAN','IDEA'],art:['LINE','HUES'],writing:['PLOT','WORD'],science:['ATOM','CELL'],languages:['VERB','WORD'],nature:['LEAF','TREE'],food:['SALT','HERB'],games:['DICE','MOVE'],wellbeing:['CALM','REST']};
let board=null;
function cells(n){const a=[...Array(20).keys()];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a.slice(0,n);}
async function round(word){const W=PPBoard.wait;board.clear();$('#g-say').textContent='Watch.';await W(600);const seq=cells(word.length);await board.flash(seq,word,650);
  $('#g-say').textContent='Your turn.';
  const {picks,times}=await board.collect(word.length,(i,k)=>{const t=board.tiles[i];if(seq[k]===i){t.classList.add('got');t.textContent=word[k];}else t.classList.add('miss');});
  const row=picks.map((p,k)=>p===seq[k]?'exact':'off'),right=row.filter(c=>c==='exact').length;if(right===word.length){board.wire(seq,6);$('#g-say').textContent='Wired.';}else $('#g-say').textContent='Close.';
  await W(900);return {right,row,ms:Math.round(times.reduce((a,b)=>a+b,0)/times.length)};}
async function firstGame(){if(board)return;board=PPBoard.create($('#bw'));const words=WORDS4[P.interests[0]]||['GROW','WIRE'];
  const r1=await round(words[0]),r2=await round(words[1]);P.first={r1,r2};
  $('#g-say').textContent='Round 2';$('#g-result').hidden=false;
  const s=v=>(v/1000).toFixed(1)+'s';
  if(r2.right>r1.right){$('#g-big').innerHTML=`${r1.right}<span class="arr">→</span>${r2.right}`;$('#g-line').textContent='More right, one round later. Your brain adjusted.';$('#g-say').textContent='You improved.';}
  else if(r2.ms<r1.ms&&r2.right>=r1.right){$('#g-big').innerHTML=`${s(r1.ms)}<span class="arr">→</span>${s(r2.ms)}`;$('#g-line').textContent='Faster already. Your brain is adapting.';$('#g-say').textContent='You got faster.';}
  else{$('#g-big').textContent=`${r2.right}/4`;$('#g-line').textContent='Warming up. This is how it starts.';$('#g-say').textContent='First rounds done.';}}

/* 4 · the navy fills and one bright neuron (landing: “This is neuroplasticity.”) */
function reveal(){fill={from:0,to:1,t0:performance.now()};
  B.scatter(motifs,[360,290],['leaf','sprig','petal','flower','tulip','heart','bolt','dots','squig','spark','star','frond','gear'],140,401,300).forEach((m,i)=>{m.s=Math.min(m.s,15);m.born=performance.now()+300+i*12;motifs.push(m);});
  neuron={t0:performance.now()+D(1600),p:{pts:B.route([[165,215],[260,280],[380,330],[480,380],[586,420]],16),frac:0,w:3}};
  /* goals come from interests now, not a question: what each interest leans on most */
  const LEAN={music:'listening',sport:'speed',code:'focus',startups:'focus',art:'seeing',writing:'memory',science:'reasoning',languages:'listening',nature:'seeing',food:'memory',games:'reasoning',wellbeing:'focus'};
  const prof={interests:P.interests,goals:[...new Set(P.interests.map(k=>LEAN[k]))],first:P.first,at:Date.now()};store.set('pp4.profile',prof);$('#to-today').href=handoff(prof);}
const toast=t=>{const el=$('#toast');el.textContent=t;el.classList.add('on');setTimeout(()=>el.classList.remove('on'),2200);};
$('#share').addEventListener('click',()=>PPShare.sheet({first:true,motifs:motifs.filter(m=>m.owner),rows:P.first?[P.first.r1.row,P.first.r2.row]:null}));
})();
</script>
</body>
</html>
