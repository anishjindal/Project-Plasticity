<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Wired</title>
<meta name="description" content="One word a day. Wire it into a pathway, then share how you did.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--ease:cubic-bezier(.4,0,.2,1);--bounce:cubic-bezier(.34,1.56,.64,1);--bg:#fff;--ink:#111318;--ink2:#5a5e68;--rule:#e6e6e3;--accent:#e4572e;--gold:#F5C63C;--pale:#dcdcd6;--navy:#131E4A;--key:#f0efeb;
  --safeb:env(safe-area-inset-bottom,0px);--safet:env(safe-area-inset-top,0px);--tile:clamp(40px,min(13.4vw,6.6svh),56px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#fff}}
:root[data-theme="dark"]{--bg:#fff}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:"Inter",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
body{max-width:440px;margin:0 auto;overflow:hidden;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;touch-action:manipulation;cursor:pointer}
.app{height:100svh;display:flex;flex-direction:column;align-items:center;padding:calc(10px + var(--safet)) 12px calc(10px + var(--safeb))}
/* header: the mascot, the name, the day */
header{width:100%;display:flex;align-items:center;justify-content:space-between;padding:0 6px}
.brand{display:flex;align-items:center;gap:8px;font-weight:600;font-size:20px;letter-spacing:-.02em}
.day{font-size:13px;color:var(--ink2);font-variant-numeric:tabular-nums}
.hbtn{background:none;border:0;padding:8px;font-size:13px;color:var(--ink2)}
.hbtn.icon{width:44px;height:44px;display:inline-flex;align-items:center;justify-content:center;color:var(--ink)}
.hr{display:flex;align-items:center;gap:2px}
.home{display:inline-block;margin-top:14px;font-size:14px;color:var(--ink2);text-decoration:none;border-bottom:1px solid var(--rule);padding-bottom:2px}
/* Neuri, the neuron */
.neuri{width:52px;height:44px;flex:none;transform-origin:50% 80%}
.neuri .body{transition:fill .3s}
.neuri .lid{transform-origin:center;animation:blink 4.5s infinite}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.neuri.happy{animation:hop .5s var(--bounce)}
.neuri.sad{animation:wob .5s var(--ease)}
.neuri.party{animation:party 1s var(--bounce) 2}
@keyframes hop{30%{transform:translateY(-8px) scale(1.08)}}
@keyframes wob{25%{transform:rotate(-10deg)}75%{transform:rotate(8deg)}}
@keyframes party{30%{transform:translateY(-12px) rotate(-12deg) scale(1.12)}60%{transform:translateY(-4px) rotate(10deg)}}
.say{font-size:14px;color:var(--ink2);min-height:1.4em;margin:4px 0 0;text-align:center;transition:opacity .25s}
/* the board: neurons, not squares */
.boardwrap{position:relative;margin-top:6px;flex:1;display:flex;align-items:center;justify-content:center;width:100%}
.board{display:grid;grid-template-rows:repeat(6,var(--tile));gap:calc(var(--tile)*.16);position:relative}
.row{display:grid;grid-template-columns:repeat(5,var(--tile));gap:calc(var(--tile)*.16)}
.row.shake{animation:shake .4s var(--ease)}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
.t{width:var(--tile);height:var(--tile);border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:calc(var(--tile)*.42);text-transform:uppercase;background:#fff;box-shadow:inset 0 0 0 2px var(--rule);position:relative;z-index:1;transition:background .25s,box-shadow .25s,color .25s}
.t.filled{box-shadow:inset 0 0 0 2px #b9b9b2;animation:pop .14s var(--ease)}
@keyframes pop{50%{transform:scale(1.12)}}
.t.exact,.t.near,.t.off{color:#fff;box-shadow:none;animation:land .5s var(--bounce) both}
.t.exact{background:var(--accent)}.t.near{background:var(--gold);color:var(--navy)}.t.off{background:#e6e6e1;color:#6b6f78}
@keyframes land{0%{transform:scale(.6)}60%{transform:scale(1.12)}100%{transform:scale(1)}}
.t.exact::after{content:"";position:absolute;inset:-6px;border-radius:50%;box-shadow:0 0 0 2px rgba(228,87,46,.4);animation:ring .7s var(--ease) both}
@keyframes ring{from{transform:scale(.7);opacity:1}to{transform:scale(1.25);opacity:0}}
.t.win{animation:winhop .6s var(--bounce) both}
@keyframes winhop{40%{transform:translateY(-14px)}}
.wires{position:absolute;inset:0;pointer-events:none;overflow:visible}
.wires path{fill:none;stroke:var(--accent);stroke-linecap:round;opacity:.55}
.wires .final{stroke:var(--navy);opacity:1;stroke-width:4}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:20}
/* keys: capsules, never boxes */
.keys{width:100%;display:flex;flex-direction:column;gap:7px;margin-top:8px}
.krow{display:flex;justify-content:center;gap:5px}
.k{flex:1;max-width:38px;height:52px;border:0;border-radius:999px;background:var(--key);font-weight:600;font-size:15px;text-transform:uppercase;transition:background .2s,transform .08s,color .2s}
.k:active{transform:scale(.9)}
.k.wide{max-width:58px;flex:1.5;font-size:18px}
.k.exact{background:var(--accent);color:#fff}.k.near{background:var(--gold);color:var(--navy)}.k.off{background:#e3e3de;color:#9a9ea6}
/* echo: recall yesterday's word before today's */
.echo{position:fixed;inset:0;z-index:15;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;background:rgba(255,255,255,.97);padding:24px;text-align:center}
.echo[hidden]{display:none}
.echo h2{margin:0;font-weight:600;font-size:26px;letter-spacing:-.02em}
.echo p{margin:0;color:var(--ink2);max-width:22em;font-size:15px}
/* results: open space, the word, your numbers, one Share */
.done{position:fixed;inset:0;z-index:12;overflow-y:auto;background:rgba(255,255,255,.985);padding:calc(18px + var(--safet)) 20px calc(30px + var(--safeb));text-align:center;opacity:0;pointer-events:none;transition:opacity .4s var(--ease)}
.done.on{opacity:1;pointer-events:auto}
.done .x{position:absolute;right:max(14px,calc(50% - 206px));top:calc(10px + var(--safet));background:none;border:0;font-size:22px;color:var(--ink2);padding:8px}
.done .neuri{width:84px;height:72px;margin:6px auto 0;display:block}
.word{font-weight:600;font-size:clamp(38px,11vw,52px);letter-spacing:.14em;margin-top:6px}
.fact{font-size:16px;line-height:1.4;max-width:24em;margin:6px auto 0}
.verdict{font-size:14px;color:var(--accent);font-weight:500;margin-top:10px}
.stats{display:flex;justify-content:center;gap:clamp(16px,6vw,32px);margin-top:26px}
.stats div{display:flex;flex-direction:column;align-items:center}
.stats b{font-weight:600;font-size:30px;letter-spacing:-.02em;line-height:1;font-variant-numeric:tabular-nums}
.stats span{font-size:12px;color:var(--ink2);margin-top:5px}
.goal{display:flex;justify-content:center;gap:9px;margin-top:22px}
.goal i{width:18px;height:18px;border-radius:50%;box-shadow:inset 0 0 0 1.5px #c9c9c4}.goal i.on{background:var(--accent);box-shadow:none}
.goalsay{font-size:13px;color:var(--ink2);margin-top:8px}
.dist{max-width:320px;margin:22px auto 0;display:grid;grid-template-columns:auto 1fr;gap:7px 10px;align-items:center;text-align:left}
.dist .n{font-size:13px;color:var(--ink2);font-variant-numeric:tabular-nums}
.dist .bar{height:20px;border-radius:10px;background:#e7e7e2;min-width:20px;display:flex;align-items:center;justify-content:flex-end;padding:0 8px;font-size:12px;font-weight:600;transition:width .6s var(--ease)}
.dist .bar.me{background:var(--accent);color:#fff}
.share{display:inline-flex;align-items:center;gap:10px;margin-top:26px;background:var(--accent);color:#fff;border:0;border-radius:999px;padding:16px 46px;font-weight:600;font-size:19px}
.share::after{content:"↗"}
.next{font-size:13px;color:var(--ink2);margin-top:16px;font-variant-numeric:tabular-nums}
.toast{position:fixed;left:50%;top:calc(70px + var(--safet));transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:999px;padding:9px 18px;font-size:14px;font-weight:500;opacity:0;transition:opacity .25s;z-index:30;pointer-events:none;white-space:nowrap}
.toast.on{opacity:1}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main class="app">
  <header>
    <div class="brand"><svg class="neuri" id="neuri" viewBox="0 0 120 100" aria-hidden="true"></svg>Wired</div>
    <div class="hr"><span class="day" id="day"></span><button class="hbtn icon" type="button" id="stats-btn" aria-label="Your stats"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M5 19V12M12 19V6M19 19V9" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg></button></div>
  </header>
  <p class="say" id="say" aria-live="polite"></p>
  <div class="boardwrap"><div class="board" id="board" aria-label="Your guesses"></div><svg class="wires" id="wires" aria-hidden="true"></svg></div>
  <div class="keys" id="keys" aria-label="Keyboard"></div>
</main>

<!-- Echo: yesterday's word, recalled before today's -->
<div class="echo" id="echo" hidden>
  <svg class="neuri" viewBox="0 0 120 100" aria-hidden="true" style="width:84px;height:72px"></svg>
  <h2>Echo</h2>
  <p>Before today’s word: can you recall yesterday’s? Pulling it back out is what makes it stick.</p>
  <div class="row" id="echo-row" style="margin-top:8px"></div>
  <button class="hbtn" type="button" id="echo-skip">Skip</button>
</div>

<!-- results -->
<section class="done" id="done" aria-labelledby="word">
  <button class="x" type="button" id="close" aria-label="Back to the board">✕</button>
  <svg class="neuri party" viewBox="0 0 120 100" aria-hidden="true"></svg>
  <div class="word" id="word"></div>
  <p class="fact" id="fact"></p>
  <p class="verdict" id="verdict"></p>
  <div class="stats"><div><b id="s-played">0</b><span>played</span></div><div><b id="s-pct">0</b><span>wired %</span></div><div><b id="s-streak">0</b><span>streak</span></div><div><b id="s-best">0</b><span>best</span></div></div>
  <div class="goal" id="goal"></div><p class="goalsay" id="goalsay"></p>
  <div class="dist" id="dist"></div>
  <button class="share" type="button" id="share">Share</button>
  <p class="next" id="next"></p>
  <a class="home" href="odyssey-v4.html">See your brain</a>
</section>
<canvas id="confetti" aria-hidden="true"></canvas>
<div class="toast" id="toast" aria-live="polite"></div>

<script src="brain.js"></script>
<script src="share.js"></script>
<script>
(function(){
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const wait=ms=>new Promise(r=>setTimeout(r,ms));
const store={get(k,d){try{return JSON.parse(localStorage.getItem(k))??d;}catch(e){return d;}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}};
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
const ME=store.get('pp6.profile',{})||{};
const buzz=ms=>{try{navigator.vibrate&&navigator.vibrate(ms);}catch(e){}};

/* ---------- Neuri: a little neuron who reacts to every guess ---------- */
const NEURI=`<g stroke="#F28C28" stroke-width="7" stroke-linecap="round" fill="none"><path d="M60 50 L22 26"/><path d="M60 50 L98 24"/><path d="M60 50 L14 64"/><path d="M60 50 L106 66"/><path d="M60 50 L60 96"/><path d="M22 26 L12 18M22 26 L16 36M98 24 L108 16M98 24 L104 34"/></g>
  <circle class="body" cx="60" cy="50" r="30" fill="#F28C28"/><circle cx="45" cy="60" r="5" fill="#E8508A" opacity=".5"/><circle cx="75" cy="60" r="5" fill="#E8508A" opacity=".5"/>
  <g class="lid"><circle cx="49" cy="47" r="4.2" fill="#131E4A"/><circle cx="71" cy="47" r="4.2" fill="#131E4A"/></g><path class="mouth" d="M52 58 Q60 65 68 58" stroke="#131E4A" stroke-width="3" fill="none" stroke-linecap="round"/>`;
$$('.neuri').forEach(s=>s.innerHTML=NEURI);
function mood(m){const n=$('#neuri');n.classList.remove('happy','sad','party');void n.offsetWidth;if(m)n.classList.add(m);
  n.querySelector('.mouth').setAttribute('d',m==='sad'?'M52 62 Q60 56 68 62':m==='party'?'M50 56 Q60 70 70 56':'M52 58 Q60 65 68 58');}

/* ---------- today's word: the same for everyone, each with what it means for your brain ---------- */
const WORDS={SLEEP:'Sleep helps your brain steady what you practised today.',SPINE:'Dendritic spines are tiny bumps where new connections form.',PRUNE:'Connections you stop using get trimmed, so busy ones run cleaner.',
  CHUNK:'Grouping things into chunks helps you hold more in mind.',LEARN:'Every time you learn, connections between neurons change strength.',AXONS:'Axons are the long wires neurons send their signals down.',
  FOCUS:'Attention helps decide what your brain keeps.',SPARK:'A neuron fires when enough signal builds up.',NERVE:'Nerves are bundles of axons carrying signals through your body.',
  BRAIN:'Your brain has about 86 billion neurons, and it keeps changing.',HABIT:'Repeat something enough and it starts to run on its own.',DREAM:'During sleep, the brain replays parts of the day.',
  SENSE:'Practice can sharpen how finely you tell things apart.',WIRED:'Cells that fire together wire together.',GLIAL:'Glial cells support neurons; some wrap axons in insulation.',
  MOTOR:'Practising a movement makes it smoother and faster.',LOBES:'Each half of your cortex has four lobes.',SKILL:'Skills you practise get faster and more accurate.',
  MUSIC:'Playing music links hearing and movement in the brain.',DANCE:'Learning a dance trains timing, balance and memory together.',PAINT:'Painters practise noticing tiny differences in colour.',
  NOVEL:'New experiences grab attention, the first step to learning.',DRILL:'Each repeat makes a path a little easier to fire.',TRAIN:'Practice just past what’s easy tends to improve fastest.',
  GRASP:'Understanding grows when new ideas connect to old ones.',ADAPT:'Your brain adapts to what you do often.',SHIFT:'Switching between tasks is a skill practice can speed up.',
  THINK:'Every thought is many neurons signalling together.',STUDY:'Spacing study over days beats cramming.',TEMPO:'Keeping time is learned: musicians tap with less timing error.',
  PIANO:'Pianists who practised more as children had more developed wiring.',CHESS:'Chess experts remember real board positions in chunks.',
  SMELL:'Smell signals reach memory areas very directly.',TOUCH:'Your fingertips are packed with touch receptors.',SIGHT:'A large share of your cortex helps you see.',
  VOICE:'You recognise voices from tiny patterns in sound.',WORDS:'Recalling a word strengthens it more than rereading it.',WRITE:'Handwriting is a fine-motor skill that improves with practice.',
  RHYME:'Rhyme and rhythm make words easier to remember.',PAUSE:'Short breaks between practice help learning stick.'};
const day=d=>Math.round((new Date(d.getFullYear(),d.getMonth(),d.getDate())-new Date(2026,9,1))/864e5)+1;
const NUM=day(new Date());
const KEYS=Object.keys(WORDS);
/* a fixed shuffle of the whole list: every word appears once before any repeats */
const ORDER=(()=>{const a=KEYS.slice(),r=PPBrain.rng(20261001);for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;})();
const wordFor=n=>ORDER[((n-1)%ORDER.length+ORDER.length)%ORDER.length];
const ANSWER=wordFor(NUM);
$('#day').textContent='#'+NUM;

/* ---------- state ---------- */
const H=store.get('wired.v1',{});const today=H[NUM]||(H[NUM]={guesses:[],rows:[],solved:false,over:false,echo:null});
const save=()=>store.set('wired.v1',H);
let cur='',busy=false;

/* ---------- board and keys ---------- */
const board=$('#board');for(let r=0;r<6;r++){const row=document.createElement('div');row.className='row';for(let c=0;c<5;c++){const t=document.createElement('div');t.className='t';row.appendChild(t);}board.appendChild(row);}
const tile=(r,c)=>board.children[r].children[c];
const LAYOUT=['qwertyuiop','asdfghjkl','↵zxcvbnm⌫'];
LAYOUT.forEach(line=>{const row=document.createElement('div');row.className='krow';[...line].forEach(ch=>{const b=document.createElement('button');b.type='button';b.className='k'+(ch==='↵'||ch==='⌫'?' wide':'');b.textContent=ch;b.dataset.k=ch;
  b.setAttribute('aria-label',ch==='↵'?'Enter':ch==='⌫'?'Delete':ch);row.appendChild(b);});$('#keys').appendChild(row);});
$('#keys').addEventListener('click',e=>{const b=e.target.closest('.k');if(b)press(b.dataset.k);});
addEventListener('keydown',e=>{if(e.metaKey||e.ctrlKey)return;if(e.key==='Enter')press('↵');else if(e.key==='Backspace')press('⌫');else if(/^[a-z]$/i.test(e.key))press(e.key.toLowerCase());});
const say=t=>{$('#say').textContent=t;};
const toast=t=>{const el=$('#toast');el.textContent=t;el.classList.add('on');clearTimeout(toast.h);toast.h=setTimeout(()=>el.classList.remove('on'),1600);};

let target='board';
function press(k){if(busy)return;if(target==='echo'){echoPress(k);return;}if(today.over)return;const r=today.guesses.length;
  if(k==='⌫'){if(cur.length){cur=cur.slice(0,-1);const t=tile(r,cur.length);t.textContent='';t.classList.remove('filled');}return;}
  if(k==='↵'){submit();return;}
  if(cur.length<5){const t=tile(r,cur.length);t.textContent=k;t.classList.add('filled');cur+=k;buzz(4);}}

/* score a guess: exact first, then wrong-spot letters, counted so doubles are fair */
function score(g,a){const res=Array(5).fill('off'),left={};for(let i=0;i<5;i++){if(g[i]===a[i])res[i]='exact';else left[a[i]]=(left[a[i]]||0)+1;}
  for(let i=0;i<5;i++)if(res[i]!=='exact'&&left[g[i]]){res[i]='near';left[g[i]]--;}return res;}
const RANK={off:1,near:2,exact:3};
function paintKeys(g,res){[...g].forEach((ch,i)=>{const b=$(`.k[data-k="${ch}"]`);if(!b)return;const was=b.dataset.s;if(!was||RANK[res[i]]>RANK[was]){b.dataset.s=res[i];b.classList.remove('exact','near','off');b.classList.add(res[i]);}});}

async function submit(){const r=today.guesses.length;
  if(cur.length<5){shake(r);say('Five letters.');return;}
  if(!/[aeiouy]/.test(cur)){shake(r);say('Needs a vowel.');return;}
  busy=true;const g=cur.toUpperCase(),res=score(g,ANSWER);
  for(let i=0;i<5;i++){const t=tile(r,i);t.classList.remove('filled');t.classList.add(res[i]);buzz(res[i]==='exact'?12:4);await wait(reduced?0:220);}
  today.guesses.push(g);today.rows.push(res);paintKeys(g.toLowerCase(),res);cur='';wireUp();
  const exact=res.filter(x=>x==='exact').length;
  if(exact===5){today.solved=true;today.over=true;save();await win();busy=false;return;}
  if(today.guesses.length>=6){today.over=true;save();mood('sad');say(`It was ${ANSWER}. A new word tomorrow.`);await wait(1200);busy=false;showDone();return;}
  save();mood(exact>=3?'happy':exact===0&&!res.includes('near')?'sad':'happy');
  say(exact>=3?'So close. The pathway is forming.':exact>0?`${exact} wired.`:res.includes('near')?'In there, wrong spot.':'Not in this word. Try new letters.');busy=false;}
function shake(r){const row=board.children[r];row.classList.remove('shake');void row.offsetWidth;row.classList.add('shake');mood('sad');buzz([20,30,20]);}

/* the pathway: each right letter wires to the one above it in the same place */
function centre(el){const a=el.getBoundingClientRect(),b=$('#wires').getBoundingClientRect();return [a.left-b.left+a.width/2,a.top-b.top+a.height/2];}
function wireUp(final){const svg=$('#wires'),W=svg.clientWidth,Hh=svg.clientHeight;svg.setAttribute('viewBox',`0 0 ${W} ${Hh}`);let d='';
  for(let c=0;c<5;c++){let prev=null;today.rows.forEach((row,r)=>{if(row[c]==='exact'){const p=centre(tile(r,c));if(prev)d+=`M${prev[0]},${prev[1]}L${p[0]},${p[1]}`;prev=p;}});}
  let html=`<path d="${d}" stroke-width="3"/>`;
  if(final){const r=today.rows.length-1,pts=[0,1,2,3,4].map(c=>centre(tile(r,c)));html+=`<path class="final" id="fin" d="M${pts.map(p=>p.join(',')).join('L')}"/>`;}
  svg.innerHTML=html;}
addEventListener('resize',()=>wireUp(today.solved));

/* the win: the row hops, the pathway connects, Neuri parties, confetti of the brain's own drawings */
async function win(){const r=today.rows.length-1;mood('party');say(['Wired first try!','Brilliant.','Lovely wiring.','Nicely done.','Got it.','Phew, wired.'][r]);
  for(let c=0;c<5;c++){tile(r,c).classList.add('win');await wait(reduced?0:90);}wireUp(true);buzz([15,40,15,40,30]);confetti();await wait(reduced?200:1500);showDone();}
function confetti(){if(reduced)return;const cv=$('#confetti'),dpr=Math.min(2,devicePixelRatio||1);cv.width=innerWidth*dpr;cv.height=innerHeight*dpr;const g=cv.getContext('2d');g.scale(dpr,dpr);
  const C=Object.values(PPBrain.C),kinds=['star','spark','heart','flower','note','bolt','leaf','dots','petal'];const bits=Array.from({length:70},(_,i)=>({x:innerWidth/2+(Math.random()-.5)*80,y:innerHeight*.45,vx:(Math.random()-.5)*9,vy:-Math.random()*11-4,s:7+Math.random()*9,rot:Math.random()*6,vr:(Math.random()-.5)*.3,kind:kinds[i%kinds.length],c:C[i%C.length]}));
  const t0=performance.now();(function f(now){const t=(now-t0)/1000;g.clearRect(0,0,innerWidth,innerHeight);bits.forEach(b=>{b.vy+=.32;b.x+=b.vx;b.y+=b.vy;b.rot+=b.vr;g.globalAlpha=Math.max(0,1-t/2.6);PPBrain.drawMotif(g,{kind:b.kind,x:b.x,y:b.y,s:b.s,rot:b.rot,c:b.c,c2:'#F5C63C'});});
    if(t<2.6)requestAnimationFrame(f);else g.clearRect(0,0,innerWidth,innerHeight);})(t0);}

/* ---------- results: the word, its meaning, your numbers, one Share ---------- */
function showDone(){const d=$('#done');$('#word').textContent=ANSWER;$('#fact').textContent=WORDS[ANSWER];
  $('#verdict').textContent=today.solved?`Wired in ${today.tries||today.rows.length}/6${today.echo?' · recalled yesterday’s too':''}`:'Not this time. Tomorrow is a new word.';
  const days=Object.keys(H).map(Number).filter(n=>H[n].over).sort((a,b)=>a-b),won=days.filter(n=>H[n].solved);
  let streak=0;for(let n=NUM;H[n]&&H[n].solved;n--)streak++;let best=0,run=0,prev=null;won.forEach(n=>{run=prev===n-1?run+1:1;best=Math.max(best,run);prev=n;});
  $('#s-played').textContent=days.length;$('#s-pct').textContent=days.length?Math.round(won.length/days.length*100):0;$('#s-streak').textContent=streak;$('#s-best').textContent=best;
  const into=streak%7||(streak?7:0);$('#goal').innerHTML=Array.from({length:7},(_,i)=>`<i class="${i<into?'on':''}"></i>`).join('');$('#goalsay').textContent=into===7?'A 7-day pathway ✨':`${into}/7 to a 7-day pathway`;
  const dist=[0,0,0,0,0,0];won.forEach(n=>dist[H[n].rows.length-1]++);const max=Math.max(1,...dist);
  $('#dist').innerHTML=dist.map((v,i)=>`<span class="n">${i+1}</span><span class="bar${today.solved&&today.rows.length===i+1?' me':''}" style="width:${Math.max(8,v/max*100)}%">${v}</span>`).join('');
  tick();clearInterval(showDone.t);showDone.t=setInterval(tick,30000);d.classList.add('on');}
function tick(){const n=new Date(),m=new Date(n.getFullYear(),n.getMonth(),n.getDate()+1)-n;$('#next').textContent=`Next word in ${Math.floor(m/36e5)}h ${Math.floor(m%36e5/6e4)}m`;}
$('#close').addEventListener('click',()=>$('#done').classList.remove('on'));
$('#stats-btn').addEventListener('click',()=>{if(today.over)showDone();else{toast('Finish today’s word first');}});
const LOVE_BRAIN={move:'sport',create:'art',sound:'music',words:'writing',numbers:'startups',build:'code',discover:'science',people:'wellbeing'};
const MOTIFS=(()=>{const B=PPBrain,ms=[];let s=11;(ME.loves||[]).forEach(l=>{const I=B.INTERESTS[LOVE_BRAIN[l]];if(I)ms.push(...B.scatter(ms,I.at,I.kinds,12,s+=17,110));});
  ms.push(...B.scatter(ms,[360,290],['leaf','sprig','petal','flower','tulip','heart','bolt','dots','squig','spark','star','frond','gear'],140,401,300).map(m=>({...m,s:Math.min(m.s,15)})));return ms;})();
const info=()=>({title:'Wired',num:NUM,tries:today.rows.length,solved:today.solved,rows:today.rows,echo:!!today.echo,motifs:MOTIFS});
$('#share').addEventListener('click',()=>PPShare.sheet(info()));

/* ---------- Echo: recall yesterday's word before today's ---------- */
const Y=H[NUM-1];let echoCur='';
function echoPress(k){const row=$('#echo-row');if(k==='⌫'){echoCur=echoCur.slice(0,-1);}else if(k==='↵'){if(echoCur.length===5)echoCheck();return;}else if(echoCur.length<5)echoCur+=k;
  [...row.children].forEach((t,i)=>{t.textContent=echoCur[i]||'';t.classList.toggle('filled',i<echoCur.length);});if(echoCur.length===5)setTimeout(echoCheck,250);}
async function echoCheck(){if(busy)return;busy=true;const y=wordFor(NUM-1),ok=echoCur.toUpperCase()===y,row=$('#echo-row');
  [...row.children].forEach((t,i)=>{t.classList.remove('filled');t.classList.add(ok?'exact':(y[i]===echoCur[i]?.toUpperCase()?'exact':'off'));t.textContent=y[i];});
  $('#echo p').textContent=ok?'Recalled. That’s retrieval practice at work.':`It was ${y}. Seeing it again still helps it stick.`;
  today.echo=ok;save();buzz(ok?[15,40,15]:20);await wait(1600);busy=false;closeEcho();}
function closeEcho(){$('#echo').hidden=true;target='board';$('#keys').style.position='';say(today.guesses.length?'':'Now today’s word.');}
function openEcho(){const row=$('#echo-row');row.innerHTML='';for(let i=0;i<5;i++){const t=document.createElement('div');t.className='t';row.appendChild(t);}
  $('#echo').hidden=false;target='echo';$('#keys').style.position='relative';$('#keys').style.zIndex=16;}
$('#echo-skip').addEventListener('click',()=>{today.echo=false;save();closeEcho();});

/* ---------- start: restore today, or begin with Echo if you played yesterday ---------- */
today.guesses.forEach((g,r)=>{const res=today.rows[r];[...g].forEach((ch,c)=>{const t=tile(r,c);t.textContent=ch.toLowerCase();t.classList.add(res[c]);});paintKeys(g.toLowerCase(),res);});
requestAnimationFrame(()=>wireUp(today.solved));
if(today.over){say(today.solved?'Wired today. See you tomorrow.':`It was ${ANSWER}.`);setTimeout(showDone,400);}
else if(Y&&Y.over&&today.echo===null&&!today.guesses.length)openEcho();
else say(today.guesses.length?'':(ME.name?`Hi ${ME.name}. Guess today’s word.`:'Guess today’s word.'));
})();
</script>
